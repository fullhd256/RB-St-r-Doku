  },
  openSheet(html) { $("sheet").innerHTML = html; $("sheetBg").classList.remove("hidden"); },
  closeSheet() { this.sheetLocked = false; $("sheetBg").classList.add("hidden"); $("sheet").innerHTML = ""; },

  /* ---- Diktierfenster (Anlage oder Detail): Aufnahme läuft -> „Aufnahme erledigt“ -> prüfen -> speichern ---- */
  dict: null,   // { startedAt, recognized, purpose }
  openDictation(startedAt, recovered, purpose) {
    purpose = purpose || "detail";
    const P = PURPOSE[purpose];
    this.dict = { startedAt, recognized: "", purpose, timeSource: "erfasst", source: "sprache" };
    this.sheetLocked = true;                    // kein versehentliches Schließen durch Tippen daneben
    this.openSheet('<h2 id="dictTitle">' + P.title + '</h2>' +
      '<div id="dictState" class="dictstate"></div>' +
      (purpose === "detail" ? '<label for="dictTime">Uhrzeit des Ereignisses</label><div class="timerow"><input type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off" id="dictTime" value="' + fmtTime(startedAt) + '"><span id="dictTimeSrc">Erfassungszeit – bei Bedarf ändern</span></div><label for="dictText">Text</label>' : '<label>Anlagenkennung (z. B. 030RB_100)</label>') +
      '<textarea id="dictText" readonly placeholder="Bitte sprechen – der erkannte Text erscheint hier laufend …"' + (purpose === "anlage" ? ' class="short"' : "") + '></textarea>' +
      '<div id="dictRecBtns" class="actions">' +
        '<button class="btn recbig" id="dictDone">■ Aufnahme erledigt</button>' +
        '<p class="hint">' + P.hint + '</p>' +
        '<div class="row"><button class="btn danger" id="dictCancel">Verwerfen</button></div>' +
      '</div>' +
      '<div id="dictEditBtns" class="actions" hidden>' +
        '<p class="hint">Text prüfen und bei Bedarf ändern – besonders Fachbegriffe und Kürzel. Ergänzen geht auch mit dem Mikrofon der Tastatur.</p>' +
        '<button class="btn primary recbig" id="dictSave">' + P.save + '</button>' +
        '<div class="row"><button class="btn" id="dictMore">Weiter diktieren</button><button class="btn danger" id="dictDiscard">Verwerfen</button></div>' +
      '</div>');
    $("dictDone").onclick = () => Speech.finishByUser();
    if ($("dictTime")) $("dictTime").oninput = () => { this.dict.timeSource = "geändert"; $("dictTimeSrc").textContent = "von Hand geändert"; };
    this.armDiscard($("dictCancel"), () => { Speech.cancel(); Speech.clearDraft(); this.closeSheet(); this.status("Diktat verworfen.", "info"); });
    this.armDiscard($("dictDiscard"), () => { Speech.clearDraft(); this.closeSheet(); this.status("Diktat verworfen.", "info"); });
    $("dictMore").onclick = () => Speech.resume(this.dict.startedAt, $("dictText").value.trim());
    $("dictSave").onclick = () => this.saveDictation();
    if (!recovered) this.dictMode("rec");
  },
  saveDictation() {
    const t = $("dictText").value.trim();
    if (!t) { this.sheetMsg("Das Feld ist leer – nichts zu speichern.", "err"); return; }
    const d = this.dict;
    if (d.purpose === "anlage") {
      const r = Anlagen.resolve(t);
      if (r.error) { this.sheetMsg(esc(r.error), "err"); return; }
      if (r.choices && !Anlagen.direct(t)) { this.showAnlageResult(t); return; }
      Speech.clearDraft(); this.closeSheet();
      this.setAnlage(r.code, d.recognized || t);
      return;
    }
    // Ereigniszeit: von Hand geändert > im Text genannt > Erfassungszeit
    let time = $("dictTime") ? normTime($("dictTime").value) : fmtTime(d.startedAt), src = d.timeSource;
    const said = Korrektur.extractTime(t).time;
    if (src !== "geändert" && said) { time = said; src = "genannt"; }
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) { this.sheetMsg("Bitte eine gültige Uhrzeit eintragen.", "err"); return; }
    Store.addEntry(t, d.startedAt, d.source, d.source === "manuell" ? t : (d.recognized || t), time, src);
    // Anlage aus dem Text übernehmen, wenn noch keine eingetragen ist (keine Pflichtabfrage)
    let found = "";
    const cur = Store.current();
    if (cur && !cur.anlage) { const c = Anlagen.detect(t); if (c) { cur.anlage = { code: c, raw: t, at: new Date().toISOString(), auto: true }; Store.save(); found = " Anlage " + c + " aus dem Text übernommen (im Titel änderbar)."; } }
    Speech.clearDraft();
    this.closeSheet(); this.render();
    this.status("✓ Schritt gespeichert (" + time + " Uhr) und chronologisch einsortiert." + found, "ok");
  },
  /* Verwerfen braucht zwei Tipps (kein Systemdialog – funktioniert überall). */
  armDiscard(btn, action) {
    let armed = false, timer = null;
    btn.onclick = () => {
      if (armed) { clearTimeout(timer); action(); return; }
      armed = true; btn.textContent = "Wirklich verwerfen? Nochmal tippen";
      timer = setTimeout(() => { armed = false; btn.textContent = "Verwerfen"; }, 4000);
    };
  },
  dictMode(mode) {
    if (!$("dictText")) return;
    const rec = mode === "rec", P = PURPOSE[this.dict.purpose];
    $("dictRecBtns").hidden = !rec; $("dictEditBtns").hidden = rec;
    $("dictText").readOnly = rec;
    $("dictTitle").textContent = rec ? P.title : P.review;
    $("dictState").hidden = !rec;
    const m = $("sheetMsg"); if (m && rec) m.remove();
    if (rec) this.dictState("starting");
  },
  dictState(state) {
    const el = $("dictState"); if (!el) return;
    el.className = "dictstate " + (state === "finishing" ? "wait" : "rec");
    el.innerHTML = {
      starting: '<span class="dot"></span><b>AUFNAHME STARTET</b> – Mikrofon wird eingeschaltet …',
      listening: '<span class="dot"></span><b>AUFNAHME LÄUFT</b> – ich höre zu',
      restarting: '<span class="dot"></span><b>AUFNAHME LÄUFT</b> – Mikrofon wird nach der Pause neu verbunden …',
      finishing: '<b>Wird abgeschlossen …</b> letzter Text wird übernommen'
    }[state] || "";
  },
  dictText(t) {
    const ta = $("dictText"); if (!ta || !ta.readOnly) return;
    ta.value = t; ta.scrollTop = ta.scrollHeight;
  },
  dictReview(text, msg, kind) {
    if (!$("dictText")) this.openDictation(Speech.session ? Speech.session.startedAt : new Date(), true, Speech.purpose);
    this.dict.recognized = text;
    const ta = $("dictText");
    ta.readOnly = false; ta.value = text;
    this.dictMode("edit");
    if (this.dict.purpose === "anlage" && text && !msg) { this.showAnlageResult(text); return; }
    this.applySaidTime(text);
    if (msg) this.sheetMsg(msg, kind);
  },
  /* Im Diktat genannte Uhrzeit ins Zeitfeld übernehmen (Vorrang vor der Erfassungszeit, nicht vor Handänderung) */
  applySaidTime(text) {
    const f = $("dictTime"); if (!f || this.dict.timeSource === "geändert") return;
    const said = Korrektur.extractTime(text || "").time;
    if (said) { f.value = said; this.dict.timeSource = "genannt"; $("dictTimeSrc").textContent = "aus dem Diktat übernommen"; }
  },
  /* Ergebnis der Kürzel-Umwandlung im Diktierfenster anzeigen (inkl. Auswahl bei Mehrdeutigkeit) */
  showAnlageResult(text) {
    const r = Anlagen.resolve(text), ta = $("dictText");
    const said = " <span class=\"said\">(gesprochen: „" + esc(text) + "“)</span>";
    if (r.error) { this.sheetMsg(esc(r.error) + said, "err"); return; }
    ta.value = r.code;
    if (r.choices) {
      this.sheetMsg("„" + esc(r.term) + "“ ist mehreren Kürzeln zugeordnet. Bitte wählen:" + said +
        '<div class="chips">' + r.choices.map(c => '<button class="chip" data-choose="' + esc(c.code) + '">' + esc(c.code) + '</button>').join("") + '</div>', "info");
      $("sheetMsg").querySelectorAll("[data-choose]").forEach(b => b.onclick = () => { ta.value = b.dataset.choose; this.sheetMsg("Gewählt: <b>" + esc(b.dataset.choose) + "</b>" + said, "ok"); });
      return;
    }
    if (r.confirm) { this.sheetMsg("Vorläufige Zuordnung: " + Anlagen.explain(r) + said + "<br>Bitte prüfen – „" + esc(r.term) + "“ ist als „bestätigen“ markiert.", "info"); return; }
    this.sheetMsg(Anlagen.explain(r) + said, "ok");
  },
  /* Beim Start: nicht gespeichertes Diktat wiederherstellen */
  restoreDraft() {
    const d = Speech.loadDraft(); if (!d || !d.text) { Speech.clearDraft(); return; }
    if (d.incidentId && Store.data.incidents.some(i => i.id === d.incidentId)) { Store.data.currentId = d.incidentId; Store.save(); this.render(); }
    this.openDictation(new Date(d.startedAt), true, d.purpose || "detail");
    this.dict.recognized = d.text;
    $("dictText").value = d.text; $("dictText").readOnly = false;
    this.dictMode("edit");
    this.sheetMsg("Nicht gespeichertes Diktat wiederhergestellt. Bitte prüfen und speichern.", "info");
  },
  /* Tastatur-Eingabe (ohne direkte Spracherkennung): gleiches Fenster, sofort im Bearbeitungsmodus */
  openManualEntry(reason, capturedAt, purpose) {
    const inc = Store.current();
    purpose = purpose || Speech.purpose || (inc && inc.anlage ? "detail" : "anlage");
    this.openDictation(capturedAt || new Date(), true, purpose);
    this.dict.recognized = ""; this.dict.source = "manuell";
    $("dictText").readOnly = false;
    this.dictMode("edit");
    if (reason) this.sheetMsg(esc(reason), "err");
    else $("dictTitle").textContent = purpose === "anlage" ? "Anlage schreiben" : "Schritt schreiben";
    setTimeout(() => $("dictText") && $("dictText").focus(), 50);
  },

  /* Anlage ändern: tippen auf die Überschrift */
  openAnlageEdit() {
    const inc = Store.current();
    const recent = this.recentCodes();
    this.openSheet('<h2>Anlage und Bereich</h2><label for="anlageInput">Kennung oder Bezeichnung (z. B. 030RB_100 oder „Roboter 30 100“)</label>' +
      '<input id="anlageInput" value="' + esc(inc && inc.anlage ? inc.anlage.code : "") + '" placeholder="Anlage">' +
      '<p class="hint" id="anlagePreview"></p>' +
      (recent.length ? '<div class="hint">Zuletzt genutzt:</div><div class="chips">' + recent.map(c => '<button class="chip" data-pick="' + esc(c) + '">' + esc(c) + '</button>').join("") + '</div>' : "") +
      '<label for="bereichInput">Bereich (optional, z. B. MRA2)</label>' +
      '<input id="bereichInput" value="' + esc(inc ? inc.bereich || "" : "") + '" placeholder="MRA2" autocomplete="off">' +
      '<div class="row actions"><button class="btn" id="anlageDictate">Anlage diktieren</button><button class="btn primary" id="anlageSave">Speichern</button></div>' +
      '<div class="row"><button class="btn" data-act="close">Abbrechen</button></div>');
    const preview = () => { const r = Anlagen.resolve($("anlageInput").value); $("anlagePreview").innerHTML = r.error ? esc(r.error) : "→ <b>" + esc(r.code) + "</b>" + (r.choices ? " (mehrdeutig: " + r.choices.map(c => esc(c.code)).join(" / ") + ")" : r.confirm ? " (vorläufig, bitte prüfen)" : ""); };
    $("anlageInput").oninput = preview; preview();
    $("sheet").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { $("anlageInput").value = b.dataset.pick; preview(); });
    $("anlageDictate").onclick = () => { this.closeSheet(); Speech.start("anlage"); };
    $("bereichInput").oninput = () => { const v = ReportRules.normBereich($("bereichInput").value); if (v !== $("bereichInput").value) $("bereichInput").value = v; };
    $("anlageSave").onclick = () => {
      const raw = $("anlageInput").value.trim();
      let code = null;
      if (raw) {                                  // Anlage ist optional – leer lassen ist erlaubt
        const r = Anlagen.resolve(raw);
        if (r.error) { this.sheetMsg(esc(r.error), "err"); return; }
        if (r.choices && !Anlagen.direct(raw)) { this.sheetMsg("Mehrdeutig – bitte das Kürzel direkt eingeben: " + r.choices.map(c => esc(c.code)).join(" oder "), "err"); return; }
        code = r.code;
      }
      const inc = Store.current() || Store.newIncident();
      inc.bereich = ReportRules.normBereich($("bereichInput").value);
      this.closeSheet();
      if (code && (!inc.anlage || inc.anlage.code !== code)) this.setAnlage(code, raw);
      else { Store.save(); this.render(); this.status("✓ Gespeichert.", "ok"); }
    };
  },
  setAnlage(code, raw) {
    const inc = Store.current() || Store.newIncident();
    inc.anlage = { code, raw: raw || code, at: new Date().toISOString() };
    Store.save(); this.render(); this.status("✓ Anlage " + code + " übernommen.", "ok");
  },

      '<div class="row"><button class="btn" data-act="close">Schließen</button></div>');
    $("sheetNewInc").onclick = () => { Store.newIncident(); this.closeSheet(); this.render(); this.status("Neuer Vorgang angelegt.", "ok"); };
    if ($("sheetNewSame")) $("sheetNewSame").onclick = () => {
      const code = cur.anlage.code; const n = Store.newIncident(); n.anlage = { code, raw: code, at: new Date().toISOString() }; n.bereich = cur.bereich || ""; Store.save();
      this.closeSheet(); this.render(); this.status("Neuer Vorgang an " + code + " angelegt.", "ok");
    };
    $("sheet").querySelectorAll("[data-inc]").forEach(b => b.onclick = () => {
      Store.data.currentId = b.dataset.inc; Store.save(); this.closeSheet(); this.render();
    });
    if ($("delInc")) $("delInc").onclick = () => {
      this.ask("Vorgang " + (cur.anlage ? cur.anlage.code + " " : "") + "mit " + cur.entries.length + " Details endgültig löschen?", "Endgültig löschen", () => {
        Store.data.incidents = Store.data.incidents.filter(i => i.id !== cur.id);
        Store.data.currentId = Store.data.incidents[0] ? Store.data.incidents[0].id : null;
        Store.save(); this.render(); this.status("Vorgang gelöscht.", "ok");
      });
    };
  },

  /* Meldung im geöffneten Fenster; ist keines offen, in der Statusleiste. */
  sheetMsg(msg, kind) {
    if ($("sheetBg").classList.contains("hidden")) { this.status(msg, kind, kind === "err"); return; }
    let box = $("sheetMsg");
    if (!box) { box = document.createElement("div"); box.id = "sheetMsg"; box.setAttribute("role", "status"); $("sheet").prepend(box); }
    box.className = "sheetmsg " + (kind || ""); box.innerHTML = msg;
    box.scrollIntoView({ block: "nearest" });
  },

  /* Zwischenablage: 1. execCommand (funktioniert auch in eingebetteten Ansichten),
     2. Clipboard-API. Erfolg wird nur gemeldet, wenn der Browser ihn bestätigt. */
  async copyText(text, label, selectEl) {
    let ok = false;
    const tmp = document.createElement("textarea");
    tmp.value = text; tmp.setAttribute("readonly", "");
    tmp.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
    document.body.appendChild(tmp);
    let copyEventFired = false;
    const onCopy = () => { copyEventFired = true; };
    document.addEventListener("copy", onCopy);
    try { tmp.focus(); tmp.select(); tmp.setSelectionRange(0, text.length); ok = document.execCommand("copy") && copyEventFired; } catch (e) { ok = false; }
    document.removeEventListener("copy", onCopy);
    tmp.remove();
    if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
    }
    if (ok) { this.sheetMsg("✓ " + label + " in die Zwischenablage kopiert (" + text.length + " Zeichen). Jetzt in der Mail-App lange drücken → Einfügen.", "ok"); return true; }
    if (selectEl) { selectEl.focus(); selectEl.select(); }
    this.sheetMsg("✗ Kopieren wurde vom Browser blockiert – die Zwischenablage ist <b>unverändert</b>." +
      (selectEl ? " Der Text ist markiert: lange auf die Markierung drücken → <b>Kopieren</b>."
                : " Bitte den Berichtstext lange drücken → <b>Kopieren</b>."), "err");
    return false;
  },

  /* E-Mail: Empfänger + Berichtsversion(en) wählen, dann ein einziger Button „Senden“.
     „Senden“ ist ein echter mailto-Link (vom Nutzer angetippt) – es wird nie automatisch versendet. */
  MAIL_SEP: "\n\n--------------------\n\n",
  mailBody(inc, versions) {
    return versions.map(v => ReportRules.renderLive(inc, v === "mit")).join(this.MAIL_SEP);
  },
  sendMail() {
    const inc = Store.current();
    if (!inc || !inc.entries.length) { this.status("Noch keine Einträge – der Bericht ist noch leer.", "err"); return; }
    const set = Store.data.settings;
    const valid = set.recipients.filter(x => x.email);
    let sel = valid.find(x => x.id === set.lastRecipientId) || (valid.length === 1 ? valid[0] : null);
    // Vorauswahl: zuletzt gewählte Version(en), beim ersten Mal die gerade angezeigte Ansicht
    let versions = Array.isArray(set.mailVersions) && set.mailVersions.length ? set.mailVersions.slice() : [inc.view === "ohne" ? "ohne" : "mit"];
    const subject = ReportRules.subjectLive(inc);
    const url = () => "mailto:" + encodeURIComponent(sel ? sel.email : "") + "?subject=" + encodeURIComponent(subject) +
                      "&body=" + encodeURIComponent(this.mailBody(inc, versions));
    const box = (v, label) => '<label class="pick"><input type="checkbox" name="ver" value="' + v + '"' + (versions.includes(v) ? " checked" : "") + '><span><b>' + label + '</b></span></label>';
    this.openSheet('<h2>Bericht senden</h2>' +
      '<label>Empfänger</label>' + (valid.length ? '<div id="rcpPick">' + valid.map(x => '<label class="pick"><input type="radio" name="rcp" value="' + x.id + '"' + (sel && sel.id === x.id ? " checked" : "") + '><span><b>' + esc(x.name || "(ohne Name)") + '</b><small>' + esc(x.email) + '</small></span></label>').join("") + '</div>'
        : '<div class="note">Noch kein Empfänger mit Adresse. In ⚙ Einstellungen anlegen – oder die Adresse in der Mail-App eintragen.</div>') +
      '<label>Berichtsversion</label><div id="verPick">' + box("mit", "Mit Uhrzeit") + box("ohne", "Ohne Uhrzeit") + '</div>' +
      '<div class="actions"><a class="btn primary linkbtn" id="mailLink" href="' + esc(url()) + '" target="_blank" rel="noopener">Senden</a></div>');
    const update = () => {
      $("mailLink").href = url();
      const n = $("mailNote"); if (n) n.remove();
    };
    $("sheet").querySelectorAll('input[name="rcp"]').forEach(rb => rb.onchange = () => {
      sel = valid.find(x => x.id === rb.value) || null;
      if (sel) { set.lastRecipientId = sel.id; Store.save(); }
      update();
    });
    $("sheet").querySelectorAll('input[name="ver"]').forEach(cb => cb.onchange = () => {
      versions = ["mit", "ohne"].filter(v => $("sheet").querySelector('input[name="ver"][value="' + v + '"]').checked);
      if (versions.length) { set.mailVersions = versions.slice(); Store.save(); }
      update();
    });
    /* Ob die Mail-App aufging, lässt sich nur indirekt erkennen: dann geht diese Seite in den Hintergrund. */
    $("mailLink").onclick = (ev) => {
      if (valid.length && !sel) { ev.preventDefault(); this.sheetMsg("Bitte zuerst einen Empfänger auswählen.", "err"); return false; }
      if (!versions.length) { ev.preventDefault(); this.sheetMsg("Bitte mindestens eine Berichtsversion auswählen.", "err"); return false; }
      $("mailLink").href = url();                // aktueller Stand der Rohdaten
      let left = false;
      const onHide = () => { if (document.hidden) left = true; };
      document.addEventListener("visibilitychange", onHide);
      window.addEventListener("pagehide", onHide);
      this.sheetMsg("Mail-App wird geöffnet …", "info");
      setTimeout(() => {
        document.removeEventListener("visibilitychange", onHide);
        window.removeEventListener("pagehide", onHide);
        if (!$("mailLink")) return;            // Fenster inzwischen geschlossen
        if (left) {
          inc.handedToMailAt = new Date().toISOString(); Store.save();
          this.sheetMsg("📨 Mail-App wurde geöffnet. <b>Noch nicht versendet</b> – bitte dort prüfen und auf Senden tippen.", "ok");
        } else {
          this.sheetMsg("✗ Es hat sich <b>keine Mail-App geöffnet</b>. In der claude.ai-Testansicht werden Mail-Links meist blockiert – in der Version auf GitHub Pages (Chrome) funktioniert es.", "err");
        }
      }, 2500);
    };
  },

  openSettings() {
    const rcpHtml = r => '<div class="rcp" data-id="' + esc(r.id) + '" data-self="' + (r.self ? 1 : 0) + '"><div class="rcphead"><span>' + (r.self ? "Eigener Eintrag" : "Empfänger") + '</span>' +
      (r.self ? "" : '<button class="rcpDel" aria-label="Empfänger entfernen">✕ Entfernen</button>') + '</div>' +
      '<input class="rcpName" value="' + esc(r.name) + '" placeholder="' + (r.self ? "Dein Name" : "Name") + '" aria-label="Name" autocomplete="off">' +
      '<input class="rcpMail" type="email" inputmode="email" value="' + esc(r.email) + '" placeholder="name@firma.de" aria-label="E-Mail-Adresse" autocomplete="off"></div>';
    const rows = Store.data.settings.kuerzel.map(r => ({ k: r.k, terms: r.terms.join(", ") }));
    const rowHtml = (r, n) => '<div class="kzrow" data-n="' + n + '"><input class="kzK" maxlength="3" value="' + esc(r.k) + '" placeholder="RB_" aria-label="Kürzel" autocapitalize="characters">' +
      '<input class="kzT" value="' + esc(r.terms) + '" placeholder="Roboter, Robi" aria-label="Begriffe"><button class="kzDel" aria-label="Kürzel entfernen">✕</button></div>';
    this.openSheet('<h2>Einstellungen</h2>' +
      '<label>Empfänger</label>' +
      '<p class="hint">Je Empfänger Name und darunter die E-Mail-Adresse – beides gehört fest zusammen. Gespeichert nur auf diesem Gerät.</p>' +
      '<div id="rcpRows">' + Store.data.settings.recipients.map(rcpHtml).join("") + '</div>' +
      '<button class="btn" id="rcpAdd" style="width:100%;margin-top:8px">＋ Empfänger hinzufügen</button>' +
      '<label>Anlagenkürzel</label>' +
      '<p class="hint">Format der Kennung: 3 Ziffern + 3 Zeichen + 3 Ziffern, z. B. 030RB_100. Fehlt die hintere Nummer, gilt 001.<br>' +
      'Pro Kürzel beliebig viele Begriffe, durch Komma getrennt. Ein <b>?</b> hinter einem Begriff (z. B. „Station?“) bedeutet: Zuordnung jedes Mal prüfen.</p>' +
      '<div class="kzhead"><span>Kürzel</span><span>Begriffe / Synonyme</span></div>' +
      '<div id="kzRows">' + rows.map(rowHtml).join("") + '</div>' +
      '<button class="btn" id="kzAdd" style="width:100%;margin-top:6px">＋ Kürzel hinzufügen</button>' +
      '<label for="kzTest">Testen</label><input id="kzTest" placeholder="z. B. Roboter 30 100"><p class="hint" id="kzOut">Gesprochene Bezeichnung eingeben, um das Ergebnis zu sehen.</p>' +
      '<details class="diag"><summary>Fehlersuche Mikrofon (nur bei Problemen)</summary>' +
        '<p class="hint">Zeigt, warum direktes Diktieren auf diesem Gerät funktioniert oder nicht. Für den normalen Betrieb nicht nötig.</p>' +
        '<div class="orig" id="diagBox">' + Speech.diagnose() +
        '\nSpeicherung: ' + (Store.storageOk ? "lokal auf diesem Gerät" : "NICHT verfügbar") +
        '\nVorgänge: ' + Store.data.incidents.length + '</div>' +
        '<div class="row"><button class="btn" id="copyDiag">Diagnose kopieren</button><button class="btn" id="manualBtn">Eingabe per Tastatur</button></div>' +
      '</details>' +
      '<div class="row actions"><button class="btn" data-act="close">Abbrechen</button><button class="btn primary" id="saveSet">Speichern</button></div>');
    const wireRcp = () => document.querySelectorAll(".rcpDel").forEach(b => b.onclick = () => b.closest(".rcp").remove());
    wireRcp();
    $("rcpAdd").onclick = () => { $("rcpRows").insertAdjacentHTML("beforeend", rcpHtml({ id: uid(), name: "", email: "" })); wireRcp(); $("rcpRows").lastElementChild.querySelector(".rcpName").focus(); };
    Speech.micPermissionState().then(st => {
      const el = $("permState"); if (!el) return;
      el.textContent = { granted: "erlaubt ✓", denied: "ABGELEHNT ✗ (Schloss-Symbol → Berechtigungen → Mikrofon)", prompt: "noch nicht gefragt (Chrome fragt beim ersten Diktieren)" }[st] || st;
    });
    const readRows = () => [...document.querySelectorAll(".kzrow")].map(r => ({
      k: r.querySelector(".kzK").value.trim().toUpperCase(),
      terms: r.querySelector(".kzT").value.split(",").map(t => t.trim()).filter(Boolean)
    })).filter(r => r.k || r.terms.length);
    const test = () => {
      const v = $("kzTest").value.trim(); if (!v) return;
      const r = Anlagen.resolve(v, readRows());
      $("kzOut").innerHTML = r.error ? esc(r.error) : "→ <b>" + esc(r.code) + "</b>" + (r.choices ? " – mehrdeutig, Auswahl: " + r.choices.map(c => esc(c.code)).join(" / ") : r.confirm ? " – vorläufig, wird zur Prüfung angezeigt" : "");
    };
    const wire = () => {
      document.querySelectorAll(".kzDel").forEach(b => b.onclick = () => { b.closest(".kzrow").remove(); test(); });
      document.querySelectorAll(".kzK, .kzT").forEach(f => f.oninput = test);
    };
    wire();
    $("kzAdd").onclick = () => { $("kzRows").insertAdjacentHTML("beforeend", rowHtml({ k: "", terms: "" }, Date.now())); wire(); $("kzRows").lastElementChild.querySelector(".kzK").focus(); };
    $("kzTest").oninput = test;
    $("saveSet").onclick = () => {
      const tbl = readRows(), seen = {};
      for (const r of tbl) {
        if (!/^[A-Z0-9_]{3}$/.test(r.k)) { this.sheetMsg("Kürzel „" + esc(r.k || "(leer)") + "“: genau 3 Zeichen (Buchstaben, Ziffern oder _), z. B. RB_.", "err"); return; }
        if (seen[r.k]) { this.sheetMsg("Kürzel " + esc(r.k) + " ist doppelt vorhanden.", "err"); return; }
        if (!r.terms.length) { this.sheetMsg("Für " + esc(r.k) + " fehlt mindestens ein Begriff.", "err"); return; }
        seen[r.k] = true;
      }
      const owners = {};
      tbl.forEach(r => r.terms.forEach(t => { const key = t.replace(/\?$/, "").toLowerCase(); (owners[key] = owners[key] || []).push(r.k); }));
      const multi = Object.entries(owners).filter(([, ks]) => ks.length > 1).map(([t, ks]) => "„" + t + "“ (" + ks.join(", ") + ")");
      /* Empfänger prüfen: Name und Adresse gehören zusammen, keine doppelten Adressen */
      const rcps = [], mails = {};
      for (const el of document.querySelectorAll(".rcp")) {
        const r = { id: el.dataset.id, name: el.querySelector(".rcpName").value.trim(), email: el.querySelector(".rcpMail").value.trim(), self: el.dataset.self === "1" };
        if (!r.self && !r.name && !r.email) continue;            // leere Zeile ignorieren
        if (r.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(r.email)) { this.sheetMsg("Die Adresse „" + esc(r.email) + "“ ist keine gültige E-Mail-Adresse.", "err"); return; }
        if (r.email && !r.name) { this.sheetMsg("Zur Adresse " + esc(r.email) + " fehlt der Name.", "err"); return; }
        if (!r.self && !r.email) { this.sheetMsg("Für „" + esc(r.name) + "“ fehlt die E-Mail-Adresse.", "err"); return; }
        const key = r.email.toLowerCase();
        if (key && mails[key]) { this.sheetMsg("Die Adresse " + esc(r.email) + " ist doppelt eingetragen.", "err"); return; }
        if (key) mails[key] = true;
        if (!r.self) delete r.self;
        rcps.push(r);
      }
      Store.data.settings.recipients = rcps;
      if (!rcps.some(r => r.id === Store.data.settings.lastRecipientId)) Store.data.settings.lastRecipientId = null;
      Store.data.settings.kuerzel = tbl;
      Store.save(); this.closeSheet();
      this.status("Einstellungen gespeichert." + (multi.length ? " Hinweis: " + esc(multi.join(", ")) + " ist mehreren Kürzeln zugeordnet – die App fragt dann nach." : ""), multi.length ? "info" : "ok", !!multi.length);
    };
    $("manualBtn").onclick = () => { Speech.purpose = null; this.openManualEntry(""); };
    $("copyDiag").onclick = () => this.copyText($("diagBox").innerText + "\nBrowser: " + navigator.userAgent, "Diagnose");
  }
};

/* ---------------- Start ---------------- */
Store.load();
UI.render();
$("micBtn").onclick = () => UI.bottomAction();
$("writeBtn").onclick = () => { Speech.purpose = null; UI.openManualEntry("", new Date(), $("writeBtn").dataset.act || "detail"); };
$("entries").addEventListener("change", ev => {
  const f = ev.target.closest(".etime"); if (!f || !f.isConnected) return;
  if (Store.setEntryTime(f.dataset.id, normTime(f.value), "geändert")) { UI.render(); UI.status("Uhrzeit geändert – Liste chronologisch neu sortiert.", "ok"); }
  else { UI.render(); UI.status("Bitte eine gültige Uhrzeit wählen.", "err"); }
});
/* Tastatur: Bedienelemente am sichtbaren Bereich ausrichten (visualViewport). Zusätzlich sorgt
   interactive-widget=resizes-content im Viewport dafür, dass Chrome den Inhalt selbst verkleinert. */
(function keyboardAware() {
  const vv = window.visualViewport; if (!vv) return;
  let maxH = 0;
  const apply = () => {
    maxH = Math.max(maxH, vv.height);
    const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty("--kb", kb + "px");
    document.documentElement.style.setProperty("--vvh", Math.round(vv.height) + "px");
    document.body.classList.toggle("kb-open", kb > 80 || vv.height < maxH * 0.75);   // Tastatur offen (auch wenn Chrome den Inhalt verkleinert)
  };
  vv.addEventListener("resize", apply); vv.addEventListener("scroll", apply); apply();
  document.addEventListener("focusin", ev => {
    if (ev.target.matches("input, textarea")) setTimeout(() => ev.target.scrollIntoView({ block: "nearest" }), 250);
  });
})();
$("incBtn").onclick = () => UI.openIncidents();
$("newIncBtn").onclick = () => { Store.newIncident(); UI.render(); UI.status("Neuer Vorgang angelegt – jetzt die Anlage nennen.", "ok"); };
$("settingsBtn").onclick = () => UI.openSettings();
$("anlageHead").onclick = () => { if (Store.current() && Store.current().anlage) UI.openAnlageEdit(); else Speech.start("anlage"); };
$("regRoh").onclick = () => UI.setRegister("roh");
$("regMit").onclick = () => UI.setRegister("mit");
$("regOhne").onclick = () => UI.setRegister("ohne");
$("sendBtn").onclick = () => UI.sendMail();
$("bereichBtn").onclick = () => { UI.openAnlageEdit(); setTimeout(() => $("bereichInput") && $("bereichInput").focus(), 60); };
$("entries").onclick = ev => {
  const b = ev.target.closest(".more"); if (b) return UI.openEntry(b.dataset.id);
  const c = ev.target.closest("[data-code]"); if (c) return UI.setAnlage(c.dataset.code, c.dataset.code);
};
$("sheetBg").onclick = ev => { if ((ev.target.id === "sheetBg" && !UI.sheetLocked) || ev.target.dataset.act === "close") UI.closeSheet(); };
document.addEventListener("visibilitychange", () => { if (document.hidden) Speech.pauseForBackground(); });
UI.restoreDraft();
if (!Speech.supported) UI.status("Spracherkennung in diesem Browser nicht verfügbar – die Eingabe läuft über das Tastatur-Mikrofon.", "info", true);
/* Logo auf ganze Pixel setzen, damit es unverändert scharf dargestellt wird (kein Unterpixel-Versatz) */
(function placeSplashLogo() {
  const img = $("splashLogo"); if (!img) return;
  const cm = 96 / 2.54;                         // 1 cm in CSS-Pixeln
  img.style.left = Math.round((innerWidth - 297) / 2) + "px";
  img.style.top = Math.round(innerHeight / 2 - 87 / 2 - cm) + "px";
  img.style.transform = "none";
})();
const themeMeta = document.querySelector('meta[name="theme-color"]');
const themeBefore = themeMeta ? themeMeta.content : null;
if (themeMeta) themeMeta.content = "#0d0d0d";
setTimeout(() => {
  $("splash").classList.add("fade");
  if (themeMeta && themeBefore) themeMeta.content = themeBefore;
  setTimeout(() => $("splash").remove(), 350);
}, 1000);
</script>
