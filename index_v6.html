<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0f172a">
<title>RB Stör-Doku</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#1d4ed8; --accent-text:#ffffff; --rec:#dc2626; --ok:#15803d; --warn:#b45309;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2937;
    --accent:#3b82f6; --rec:#ef4444; --ok:#22c55e; --warn:#f59e0b;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2937;
  --accent:#3b82f6; --rec:#ef4444; --ok:#22c55e; --warn:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* Splash */
/* Startbildschirm: exakte Hintergrundfarbe des Logos (#0D0D0D) über das ganze Display,
   Logo in Originalgröße 297 × 87 px, mittig, ca. 1 cm über der Bildschirmmitte */
#splash{position:fixed;inset:0;z-index:50;background:#0d0d0d;transition:opacity .3s}
#splash.fade{opacity:0;pointer-events:none}
#splashLogo{position:absolute;left:50%;top:50%;width:297px;height:87px;max-width:none;transform:translate(-50%,calc(-50% - 1cm));display:block}

/* Layout */
#app{display:flex;flex-direction:column;height:var(--vvh,100%);max-width:640px;margin:0 auto}
header{padding:12px 16px 8px;display:flex;align-items:center;gap:8px}
.inc-switch{flex:1;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.inc-switch small{display:block;color:var(--muted);font-size:12px}
.inc-switch b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);min-width:48px;height:48px;font-size:20px;display:flex;align-items:center;justify-content:center}

main{flex:1;overflow-y:auto;padding:4px 16px 16px}
.empty{color:var(--muted);text-align:center;padding:40px 12px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;display:flex;gap:10px}
.entry time{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px}
.entry .body{flex:1;min-width:0;white-space:pre-wrap;word-wrap:break-word}
.entry .meta{color:var(--muted);font-size:12px;margin-top:4px}
.entry .more{background:none;border:none;color:var(--muted);font-size:20px;padding:0 4px;align-self:flex-start;min-width:36px;min-height:36px}

/* Status + bottom bar */
#status{margin:0 16px 8px;padding:10px 12px;border-radius:var(--radius);font-size:15px;background:var(--card);border:1px solid var(--line)}
#status.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
#status.ok{border-color:var(--ok);color:var(--ok)}
#status.err{border-color:var(--rec);color:var(--rec)}
#status.info{border-color:var(--warn);color:var(--warn)}
#status .live{display:block;font-style:italic;opacity:.9;margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-right:8px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.bottom{padding:8px 16px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr;gap:10px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);min-height:48px;padding:10px 12px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--rec)}
#micBtn{grid-column:1 / -1;height:88px;border:none;border-radius:44px;background:var(--accent);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 20px rgba(29,78,216,.35)}
#micBtn.rec{background:var(--rec);box-shadow:0 0 0 6px rgba(220,38,38,.25)}
#micBtn svg{width:32px;height:32px}
#micBtn.mail{background:var(--accent)}
#micBtn svg[hidden]{display:none}

/* Anlage, Reiter, Bericht */
#anlageHead{margin:2px 16px 8px;font-size:30px;font-weight:700;letter-spacing:.5px;background:none;border:none;text-align:left;padding:0;display:flex;align-items:center;gap:10px;color:var(--text)}
#anlageHead.empty-head{font-size:20px;font-weight:600;color:var(--muted)}
#anlageHead .edit{font-size:18px;color:var(--muted);font-weight:400}
.tabs{margin:0 16px 8px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.tabs button{border:none;background:none;padding:11px 8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-text)}
.badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;border:1px solid currentColor;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font-weight:600;min-height:40px}
.donebtn{width:100%;margin:4px 0 8px;min-height:52px;border:2px solid var(--ok);color:var(--ok);background:var(--card)}
.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}
.field{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#repSubject{font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:12px 0 8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:10px 6px;font-weight:600;color:var(--muted);min-height:44px}
.seg button.on{background:var(--text);color:var(--bg)}
.repcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 12px}
.hrow{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hrow:last-child{border-bottom:none}
.hrow span{color:var(--muted)}
.hrow .field{padding:7px 9px}
.ritem{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.rtimebox{display:flex;flex-direction:column;align-items:center;gap:2px;width:92px;flex:none}
.rtime{width:92px;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 4px}
.rtimebox small{font-size:11px;color:var(--muted)}
.rtext{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;resize:none;overflow:hidden;line-height:1.4}
.kzhead{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.kzrow{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:6px;margin-top:6px}
.sheet .kzrow input{padding:9px 8px}
.kzK{font-weight:700;text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace}
.kzDel{border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--rec);font-size:16px}
details.diag{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
details.diag summary{font-weight:600;color:var(--muted);min-height:32px;display:flex;align-items:center}
.said{opacity:.8;font-size:13px}
/* v6 (korrigiert): Register ganz oben, Titel in den Rohdaten, schlichte Eingabe-Buttons */
.regs{margin:12px 16px 4px!important}
#anlageHead,#bereichBtn{display:none!important}
#inputRow .inbtn{height:84px;border:1.5px solid #111;border-radius:18px;background:#fff;color:#111;font-size:18px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;padding:0 8px;box-shadow:none;grid-column:auto}
#inputRow .inbtn .bicon{width:30px;height:30px;color:#111}
#inputRow #micBtn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
#inputRow #micBtn.rec .bicon{color:#fff}
#inputRow{grid-template-columns:1fr 1fr}
#inputRow.report{grid-template-columns:1fr}
#inputRow.report .inbtn{display:none!important}
#inputRow.report #sendBtn{font-size:19px}
.titlecard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:4px 0 12px;display:grid;gap:8px}
.titlecard .tlabel{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.titlecard input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 44px;gap:8px}
.tmic{border:1.5px solid #111;background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
.tmic svg{width:22px;height:22px}
#tAnlage{font-weight:700;letter-spacing:.3px}
#tBereich{font-weight:700}
.tprob{display:flex;gap:8px;align-items:center}
.tprob input{flex:1}
.tauto{font-size:12px;color:var(--muted);white-space:nowrap;background:none;border:none;padding:4px}
.tout{font-size:17px;font-weight:800;line-height:1.3;padding-top:4px;border-top:1px solid var(--line)}
.tzeit{font-size:14px;color:var(--muted);font-weight:600}
.steplbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:2px 0 6px}
/* v6: laufende Dokumentation – Register oben, Bericht live */
.regs{margin:0 16px 8px}
.bereich{margin:-4px 16px 8px;background:none;border:none;padding:0;text-align:left;color:var(--muted);font-weight:600;font-size:15px;min-height:28px}
.bereich b{color:var(--text)}
#sendBtn{height:88px;border:none;border-radius:44px;background:var(--accent);color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;padding:0 12px;box-shadow:0 6px 20px rgba(29,78,216,.35)}
#sendBtn svg{width:28px;height:28px;flex:none}
#sendBtn[hidden]{display:none}
.wico{display:none;font-size:30px;line-height:1}
.inputrow.report{grid-template-columns:76px 76px minmax(0,1fr)}
.inputrow.report #writeLabel,.inputrow.report #writeSub,.inputrow.report .mlbl{display:none}
.inputrow.report .wico{display:block}
#inputRow.report #micBtn .mlbl{display:none}
#inputRow.report #micBtn{gap:0}
#inputRow.report #sendBtn{font-size:17px;white-space:nowrap}
@media (max-width:360px){#inputRow.report #sendBtn{white-space:normal;gap:6px;line-height:1.15;padding:0 8px}#inputRow.report #sendBtn svg{width:22px;height:22px}#inputRow.report #sendBtn span{font-size:15px}.inputrow.report{grid-template-columns:64px 64px minmax(0,1fr)}}
.inputrow.report #micBtn{padding:0}
.repview{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:6px}
.rtitle{font-size:18px;font-weight:800;line-height:1.3}
.rzeit{font-size:15px;font-weight:600;margin-bottom:10px}
.rline{padding:7px 0;border-top:1px solid var(--line)}
.rline b{font-variant-numeric:tabular-nums}

/* v5: Register und Überschrift im Bericht */
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg3 button{font-size:14px;padding:10px 4px}
.headcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:4px 0 14px;display:grid;gap:8px}
.headcard input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.hbig{font-size:22px!important;font-weight:800;letter-spacing:.5px}
.hbig::placeholder{font-weight:500;letter-spacing:0}
.hline{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hstich{flex:1;min-width:0;font-weight:700}
.hmin{font-size:20px;font-variant-numeric:tabular-nums}
.hzeit{font-size:14px}
.hm{width:62px;padding:7px 4px!important;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hwarn{font-size:13px;color:var(--warn)}
.para{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.5;white-space:pre-wrap}
.raw{display:flex;gap:10px;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.rawtime{font-weight:700;font-variant-numeric:tabular-nums;min-width:46px}
.rawbody{flex:1;min-width:0;white-space:pre-wrap}
.rawmeta{font-size:12px;color:var(--muted);margin-top:3px}
/* v4: Eingabe wählen, Uhrzeit je Eintrag, Empfänger, Tastatur */
.inputrow{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.inputrow.single{grid-template-columns:1fr}
#inputRow #micBtn{grid-column:auto;min-width:0;padding:0 12px}
#inputRow #writeBtn{min-width:0}
#writeBtn[hidden]{display:none}
@media (max-width:360px){#writeBtn{font-size:16px}#micBtn{font-size:18px}.etime{width:84px}}
#writeBtn{height:88px;border:2px solid var(--accent);border-radius:44px;background:var(--card);color:var(--accent);font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
#micBtn small,#writeBtn small{display:block;font-size:12px;font-weight:600;opacity:.85}
#micBtn .mlbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.entry .etimebox{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.etime{width:92px;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 4px;text-align:center}
.etimebox small{font-size:11px;color:var(--muted)}
.timerow{display:flex;align-items:center;gap:10px}
.timerow input{width:120px;font-weight:700;font-size:18px}
.timerow span{font-size:13px;color:var(--muted)}
.rcp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;display:grid;gap:6px}
.rcphead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.rcpDel{border:none;background:none;color:var(--rec);font-weight:600;min-height:32px}
.pick{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.pick input{width:22px;height:22px;flex:none}
.pick small{display:block;color:var(--muted)}
.pick:has(input:checked){border-color:var(--accent);border-width:2px}
.sheet label.pick{display:flex;align-items:center;gap:12px;color:var(--text);font-size:17px;margin:8px 0 0;min-height:56px;cursor:pointer}
.sheet label.pick input{width:24px;height:24px;flex:none;margin:0;padding:0;accent-color:var(--accent)}
.sheet label.pick b{color:var(--text)}
.sheet .actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--bg);padding:6px 0 calc(10px + env(safe-area-inset-bottom));z-index:2}
body.kb-open #dictText{min-height:72px}
body.kb-open #dictText.short{min-height:56px}
#dictText.short{min-height:90px;font-size:22px;font-weight:700;letter-spacing:.5px}

/* Sheets */
.sheet-bg{position:fixed;inset:0;bottom:var(--kb,0px);background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(var(--vvh,100vh) * .94);overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:19px}
.sheet label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.sheet input,.sheet textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sheet textarea{min-height:120px;resize:vertical}
#reportText{min-height:50vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row .btn{flex:1}
.list-item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.list-item.active{border-color:var(--accent);border-width:2px}
.list-item small{color:var(--muted);display:block}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.note{border-left:3px solid var(--warn);padding:6px 10px;font-size:14px;margin:10px 0;background:var(--card)}
.sheetmsg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:15px;background:var(--card);border:1px solid var(--line)}
.sheetmsg.ok{border-color:var(--ok);color:var(--ok)}
.sheetmsg.err{border-color:var(--rec);color:var(--rec)}
.sheetmsg.info{border-color:var(--warn);color:var(--warn)}
.linkbtn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:14px;text-decoration:none}
a.btn.primary{color:var(--accent-text)}
.dictstate{padding:10px 12px;border-radius:10px;margin-bottom:4px;font-size:15px}
.dictstate.rec{background:var(--rec);color:#fff}
.dictstate.wait{background:var(--card);border:1px solid var(--warn);color:var(--warn)}
#dictText{min-height:34vh}
.recbig{width:100%;min-height:64px;margin-top:14px;font-size:19px;border:none;background:var(--rec);color:#fff;border-radius:32px}
.btn.primary.recbig{background:var(--accent)}
.orig{color:var(--muted);font-size:14px;white-space:pre-wrap;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
</style>

<script>
"use strict";
/* =====================================================================
   Störungslogger – Prototyp
   Aufbau:
   1. Store       – Datenmodell + lokale Speicherung (localStorage)
   2. ReportRules – Berichtserzeugung (hier später Regeln/Fachbegriffe ergänzen)
   3. Speech      – Spracherkennung (Web Speech API) + Fallback
   4. UI          – Darstellung und Bedienung
   ===================================================================== */

/* ---------------- 1. Store ---------------- */
const STORAGE_KEY = "stoerungslogger.v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const Store = {
  data: { version: 1, settings: { email: "" }, incidents: [], currentId: null },
  storageOk: true,

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) this.data = Object.assign(this.data, JSON.parse(raw));
    } catch (e) { this.storageOk = false; }
    /* Ältere Daten übernehmen: fehlende Felder ergänzen, alter Textbericht bleibt als legacyReport erhalten */
    if (!Array.isArray(this.data.settings.kuerzel))
      this.data.settings.kuerzel = Anlagen.DEFAULTS.map(r => ({ k: r.k, terms: [...r.terms] }));
    /* Empfänger: aus der bisherigen einzelnen Adresse übernehmen, nichts erfinden */
    if (!Array.isArray(this.data.settings.recipients))
      this.data.settings.recipients = [{ id: uid(), name: "", email: this.data.settings.email || "", self: true }];
    this.data.incidents.forEach(i => {
      /* Ereigniszeit je Eintrag (ältere Einträge: genannte Uhrzeit oder Erfassungszeit) */
      (i.entries || []).forEach(e => {
        if (!e.time) { const t = Korrektur.extractTime(e.text).time; e.time = t || fmtTime(new Date(e.createdAt)); e.timeSource = t ? "genannt" : "erfasst"; }
      });
      this.sortEntries(i);
      if (!("anlage" in i)) i.anlage = null;
      if (i.report && !i.report.items) { i.legacyReport = i.report; i.report = null; }
      /* v6: Bericht wird laufend aus den Rohdaten erzeugt. Gespeicherte Entwürfe bleiben als legacyReport erhalten,
         ein dort bereits eingetragener Bereich wird in den Vorgang übernommen (nicht erneut abfragen). */
      if (i.report) { if (!i.bereich && i.report.heading && i.report.heading.bereich) i.bereich = i.report.heading.bereich;
                      if (!i.view && i.report.view) i.view = i.report.view; i.legacyReport = i.report; i.report = null; }
      if (!("bereich" in i)) i.bereich = "";
    });
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  },
  save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); this.storageOk = true; }
    catch (e) { this.storageOk = false; UI.status("Speichern fehlgeschlagen – Daten gehen beim Schließen verloren!", "err"); }
  },
  current() { return this.data.incidents.find(i => i.id === this.data.currentId) || null; },
  newIncident() {
    const now = new Date();
    const inc = { id: uid(), title: "Störung " + fmtDate(now) + " " + fmtTime(now),
                  createdAt: now.toISOString(), anlage: null, entries: [], report: null };
    this.data.incidents.unshift(inc);
    this.data.currentId = inc.id;
    this.save();
    return inc;
  },
  /* Ereigniszeitpunkt eines Eintrags: Datum der Erfassung + bearbeitbare Uhrzeit (e.time).
     Liegt die Uhrzeit mehr als 12 h nach der Erfassung, war das Ereignis am Vortag (z. B. kurz nach Mitternacht erfasst). */
  eventDate(e) {
    const cap = new Date(e.createdAt), d = new Date(cap);
    const [h, m] = String(e.time || fmtTime(cap)).split(":").map(Number);
    d.setHours(h || 0, m || 0, 0, 0);
    if (d - cap > 12 * 3600000) d.setDate(d.getDate() - 1);
    return d;
  },
  /* Maßgebliche Reihenfolge: Ereigniszeit; bei gleicher Uhrzeit stabil nach Erfassungszeitpunkt */
  compare(a, b) {
    return (Store.eventDate(a) - Store.eventDate(b)) || a.createdAt.localeCompare(b.createdAt) || String(a.id).localeCompare(String(b.id));
  },
  sortEntries(inc) { if (inc && inc.entries) inc.entries.sort((a, b) => this.compare(a, b)); },
  /* capturedAt = Erfassungszeitpunkt (unveränderlich). time = Ereigniszeit HH:MM (bearbeitbar). */
  addEntry(text, capturedAt, source, originalText, time, timeSource) {
    const inc = this.current() || this.newIncident();
    const orig = originalText || text;           // erkannter Rohtext bleibt getrennt erhalten
    inc.entries.push({ id: uid(), createdAt: capturedAt.toISOString(), source,
                       time: time || fmtTime(capturedAt), timeSource: timeSource || "erfasst",
                       originalText: orig, text, editedAt: orig !== text ? new Date().toISOString() : null });
    this.sortEntries(inc);
    this.save();
  },
  /* Uhrzeit ändern: Liste neu sortieren und Uhrzeit im Bericht mitführen (Berichtstexte bleiben unverändert) */
  setEntryTime(id, time, source) {
    const inc = this.current(); const e = inc && inc.entries.find(x => x.id === id);
    if (!e || !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) return false;
    e.time = time; e.timeSource = source || "geändert";
    this.sortEntries(inc);
    ReportRules.syncTimes(inc);
    this.save();
    return true;
  },
  editEntry(id, text) {
    const e = this.current().entries.find(x => x.id === id);
    if (!e || e.text === text) return;
    e.text = text; e.editedAt = new Date().toISOString();   // createdAt bleibt unverändert
    this.save();
  },
  deleteEntry(id) {
    const inc = this.current();
    inc.entries = inc.entries.filter(x => x.id !== id);
    this.save();
  }
};

/* ---------------- 2. Korrektur + Bericht ----------------
   Korrektur: bringt Diktate in Schreibform. Bewusst regelbasiert und erweiterbar –
   die endgültigen Regeln legen wir gemeinsam fest (hier ergänzen, nicht im UI).
   Grundsatz: Aussage nie verändern, nichts erfinden, Originaltext bleibt im Eintrag. */
const Korrektur = {
  /* Anlagenkennung: genau 2 Buchstaben + 2 Ziffern, einheitlich z. B. "SA11".
     Erkennt auch Sprachvarianten wie "SA 11", "S A 11", "s.a.-11". */
  KENNUNG_RE: /(?:^|[^A-Za-zÄÖÜäöüß])([A-Za-z])[.\s-]{0,2}([A-Za-z])\.?[\s-]{0,2}(\d)\s?(\d)(?!\d)/,
  KENNUNG_FMT: /^[A-Z]{2}\d{2}$/,
  parseKennung(text) {
    if (!text) return null;
    const t = String(text).trim();
    const strict = t.toUpperCase().replace(/[\s.\-]/g, "");
    if (this.KENNUNG_FMT.test(strict)) return strict;
    // zuerst großgeschriebene Paare (so liefert die Spracherkennung Kürzel), dann beliebige
    const upper = new RegExp(this.KENNUNG_RE.source.replace(/\[A-Za-z\]/g, "[A-Z]"));
    const m = upper.exec(t) || this.KENNUNG_RE.exec(t);
    return m ? (m[1] + m[2]).toUpperCase() + m[3] + m[4] : null;
  },

  /* Ausdrücklich genannte Uhrzeit finden (hat Vorrang vor dem Erfassungszeitpunkt).
     Liefert { time: "HH:MM" | null, rest: Text ohne die Zeitangabe }. */
  TIME_PATTERNS: [
    /(?:\b(?:um|gegen|ab)\s+)?\b([01]?\d|2[0-3])[:.]([0-5]\d)\s*uhr\b/i,   // 14:32 Uhr / 14.32 Uhr
    /\b(?:um|gegen|ab)\s+([01]?\d|2[0-3])[:.]([0-5]\d)\b/i,               // um 14.32
    /\b([01]?\d|2[0-3]):([0-5]\d)\b/,                                     // 14:32
    /(?:\b(?:um|gegen|ab)\s+)?\b([01]?\d|2[0-3])\s*uhr(?:\s+([0-5]?\d)(?![\d:.]))?\b/i   // 14 Uhr 32 / 9 Uhr
  ],
  extractTime(text) {
    for (const re of this.TIME_PATTERNS) {
      const m = re.exec(text);
      if (!m) continue;
      const time = pad(+m[1]) + ":" + pad(+(m[2] || 0));
      let rest = (text.slice(0, m.index) + " " + text.slice(m.index + m[0].length));
      rest = rest.replace(/\s+([,.;:])/g, "$1").replace(/^[\s,;:–-]+/, "").replace(/\s{2,}/g, " ").trim();
      return { time, rest };
    }
    return { time: null, rest: text };
  },

  /* Schreibweisen für Fachbegriffe/Kürzel – wird mit realen Beispielen erweitert. */
  GLOSSARY: [
    [/\bi\.?\s?o\.?(?=[\s,.;]|$)/gi, "i. O."],
    [/\bn\.?\s?i\.?\s?o\.?(?=[\s,.;]|$)/gi, "n. i. O."],
    [/\bham\s?(\d{3})\b/gi, "HAM $1"],
    [/\bsps\b/gi, "SPS"],
    [/\bnot\s?aus\b/gi, "Not-Aus"],
    [/\blampen\s?test\b/gi, "Lampentest"]
  ],
  FILLER: /^(?:(?:also|ähm|äh|ehm|ja|okay|ok)[,\s]+)+/i,

  correct(text) {
    let t = String(text || "").replace(/\s+/g, " ").trim();
    t = t.replace(this.FILLER, "");
    // Anlagenkennungen im Text einheitlich schreiben (SA 11 -> SA11)
    t = t.replace(/(^|[^A-Za-zÄÖÜäöüß])([A-Z])[.\s-]{0,2}([A-Z])\.?[\s-]{0,2}(\d)\s?(\d)(?!\d)/g, "$1$2$3$4$5");
    for (const [re, rep] of this.GLOSSARY) t = t.replace(re, rep);
    t = t.replace(/\s+([,.;:!?])/g, "$1").replace(/([,;])(?=\S)/g, "$1 ");
    if (t) t = t.charAt(0).toUpperCase() + t.slice(1);
    if (t && !/[.!?]$/.test(t)) t += ".";
    return t;
  },

  /* Hook für eine spätere KI-Korrektur (z. B. über einen eigenen Server). Absichtlich leer. */
  ai: null
};

/* Bericht: strukturierte Daten; beide Ansichten (mit/ohne Uhrzeiten) werden daraus nur dargestellt. */
const ReportRules = {
  /* Stichwörter für den Betreff. prio 1 = Ursache/Befund, prio 2 = Symptom.
     Es werden höchstens zwei Begriffe genommen, Ursachen vor Symptomen. */
  KEYWORDS: [
    { re: /schalterdefekt|schalter\S*\s+(?:ist\s+|war\s+)?(?:defekt|kaputt)|defekte[nr]?\s+schalter/i, kw: "Schalterdefekt", prio: 1 },
    { re: /wackler|wackelkontakt|wackel/i, kw: "Wackler", prio: 1 },
    { re: /nicht\s+programmiert|programmierfehler|falsch\s+programmiert|programmierung\s+fehlt/i, kw: "Programmierfehler", prio: 1 },
    { re: /kurzschluss/i, kw: "Kurzschluss", prio: 1 },
    { re: /kabelbruch|kabel\s+(?:defekt|gebrochen|beschädigt)/i, kw: "Kabelbruch", prio: 1 },
    { re: /sicherung|schutzschalter|ls-?schalter/i, kw: "Sicherung ausgelöst", prio: 1 },
    { re: /stecker|steckverbind/i, kw: "Steckverbindung", prio: 1 },
    { re: /(?:sensor|initiator|lichtschranke)\S*\s+(?:defekt|verstellt|verschmutzt)/i, kw: "Sensorfehler", prio: 1 },
    { re: /druckluft|leckage|undicht/i, kw: "Druckluftleck", prio: 1 },
    { re: /(?:profinet|profibus|bus|kommunikation)\S*\s*(?:fehler|störung|ausfall)/i, kw: "Kommunikationsfehler", prio: 1 },
    { re: /(?:glühbirne|leuchtmittel|lampe|leuchtmelder)\S*.{0,40}(?:defekt|kaputt|funktioniert nicht|reagier\w* nicht|aus)/i, kw: "Leuchtmelder ohne Funktion", prio: 2 },
    { re: /motor\S*.{0,30}(?:defekt|blockiert|läuft nicht)/i, kw: "Motorstörung", prio: 2 },
    { re: /not-?aus/i, kw: "Not-Aus", prio: 2 },
    { re: /ausfall|ausgefallen|stillstand/i, kw: "Ausfall", prio: 2 }
  ],
  /* Die (höchstens zwei) wichtigsten Stichwörter – Ursachen vor Symptomen */
  keywords(texts) {
    const all = texts.join(" \n ");
    const hits = [];
    this.KEYWORDS.forEach((k, order) => { const m = k.re.exec(all); if (m) hits.push({ ...k, pos: m.index, order }); });
    hits.sort((a, b) => a.prio - b.prio || a.pos - b.pos);
    return hits.slice(0, 2).map(h => h.kw);
  },
  subject(code, texts) {
    const all = texts.join(" \n ");
    const hits = [];
    this.KEYWORDS.forEach((k, order) => { const m = k.re.exec(all); if (m) hits.push({ ...k, pos: m.index, order }); });
    hits.sort((a, b) => a.prio - b.prio || a.pos - b.pos);
    let words = hits.slice(0, 2).map(h => h.kw);
    if (!words.length && texts[0]) words = [texts[0].replace(/[.!?]$/, "").split(" ").slice(0, 4).join(" ")];
    return (code || "Anlage ?") + (words.length ? ", " + words.join(" plus ") : "");
  },

  /* Einträge -> Berichtsposten. Uhrzeit = bearbeitbare Ereigniszeit des Eintrags,
     Reihenfolge = dieselbe chronologische Sortierung wie in der Eintragsliste. */
  items(inc) {
    return [...inc.entries].sort((a, b) => Store.compare(a, b)).map(e => {
      const { time, rest } = Korrektur.extractTime(e.text);
      // genannte Uhrzeit nur aus dem Satz nehmen, wenn sie der Ereigniszeit entspricht (steht dann davor)
      const text = Korrektur.correct(time && time === e.time ? (rest || e.text) : e.text);
      return { entryId: e.id, time: e.time, timeSource: e.timeSource || "erfasst", text };
    });
  },
  /* Störzeit = erste bis letzte dokumentierte Ereigniszeit (chronologisch) */
  spanTimes(inc) {
    const sorted = [...inc.entries].sort((a, b) => Store.compare(a, b));
    return { beginn: fmtTime(Store.eventDate(sorted[0])), ende: fmtTime(Store.eventDate(sorted[sorted.length - 1])) };
  },
  /* Ausfall in ganzen Minuten; Ende vor Beginn = über Mitternacht */
  minutes(beginn, ende) {
    const p = t => { const m = /^(\d{2}):(\d{2})$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
    const a = p(beginn), b = p(ende);
    if (a === null || b === null) return null;
    return (b - a + 1440) % 1440;
  },
  /* Bereich in der Überschrift: Großbuchstaben, keine Bindestriche/Leerzeichen (z. B. MRA2) */
  normBereich(v) { return String(v || "").toUpperCase().replace(/[^A-Z0-9ÄÖÜ]/g, ""); },
  stichwort(inc) {
    const kws = this.keywords(this.items(inc).map(i => i.text));
    return kws.length ? kws.join(" und ") : "Störung";
  },
  heading(inc) {
    return Object.assign({ bereich: Store.data.settings.lastBereich || "", stichwort: this.stichwort(inc) }, this.spanTimes(inc));
  },
  /* ---- v6: Bericht laufend aus den Rohdaten ----
     Titel:   Bereich Anlage Störungsbezeichnung – Ausfall N Minuten   (fehlende Teile entfallen, nichts wird erfunden)
     Zeile 2: Störzeit Beginn bis Ende = Ausfall N Minuten              (erst ab zwei Einträgen; bei einem Eintrag nur „ab“) */
  /* ---- Berichtsaufbau (verbindlich) ----
       [Bereich] [Anlage] [Problem/Arbeit] Ausfall: [N] min
       Störzeit: [Beginn] - [Ende]
       IH vor Ort: [Uhrzeit]            (nur wenn im Text erwähnt)
       (Leerzeile)
       Störungsverlauf                  (mit Uhrzeit zeilenweise, ohne Uhrzeit fortlaufend)
     Alles wird bei jeder Anzeige aus den Rohdaten berechnet; fehlende Teile entfallen, nichts wird erfunden. */
  IH_RE: /(?:\b(?:um|gegen|ab)\s+)?(?:\b\d{1,2}[:.]\d{2}\s*(?:uhr\b)?\s*)?\b(?:IH|Instandhaltung|Instandhalter(?:in)?)\b(?:\s+(?!vor\b)[\wäöüÄÖÜß:.]+){0,4}?\s+vor\s*ort\b(?:\s*(?:um|ab|gegen|seit)?\s*\d{1,2}[:.]\d{2}(?:\s*uhr\b)?)?/i,
  /* Zeitpunkt „IH vor Ort“: im Satz genannte Uhrzeit, sonst Ereigniszeit des Schritts (erste Erwähnung) */
  ihTime(inc) {
    const sorted = [...inc.entries].sort((a, b) => Store.compare(a, b));
    for (const e of sorted) {
      const m = this.IH_RE.exec(e.text);
      if (!m) continue;
      const t = /(\d{1,2})[:.](\d{2})/.exec(m[0]);
      return t ? normTime(t[1] + ":" + t[2]) || e.time : e.time;
    }
    return "";
  },
  /* Störungsverlauf: Schritte ohne die „IH vor Ort“-Angabe (die steht im Kopf); reine IH-Schritte entfallen */
  verlauf(items) {
    return items.map(i => {
      const rest = this.bare(i.text.replace(this.IH_RE, " ").replace(/\s+([,.;:])/g, "$1").replace(/^[\s,.;:–-]+|[\s,;:–-]+$/g, "").replace(/\s{2,}/g, " "));
      return rest ? Object.assign({}, i, { text: rest.charAt(0).toUpperCase() + rest.slice(1) }) : null;
    }).filter(Boolean);
  },
  /* Problem/Arbeit für den Titel: zuerst die dokumentierte Arbeit („Schalter getauscht“),
     sonst der dokumentierte Defekt („Schalter defekt“). Wörtlich aus dem Text, höchstens zwei, chronologisch. */
  ACTION_WORDS: "ausgetauscht|getauscht|ersetzt|erneuert|repariert|instandgesetzt|neu gesteckt|nachgezogen|festgezogen|neu programmiert|programmiert|korrigiert|neu eingestellt|eingestellt|justiert|gereinigt|neu gestartet|zurückgesetzt|behoben",
  actions(texts) {
    const N = "([A-ZÄÖÜ][a-zäöüß]+(?:[- ](?:[A-Z]{0,3}\\d+[A-Za-z]?))?)";
    const re = new RegExp(N + "\\s+(?:wurde\\s+|wird\\s+|ist\\s+)?(?:" + "neu\\s+|wieder\\s+)?(" + this.ACTION_WORDS + ")\\b");
    const out = [];
    for (const t of texts) {
      const m = re.exec(t);
      if (!m || /^(Problem|Fehler|Störung|Ursache)$/.test(m[1])) continue;
      const v = m[1] + " " + m[2];
      if (!out.some(x => x.toLowerCase() === v.toLowerCase())) out.push(v);
      if (out.length === 2) break;
    }
    return out;
  },
  live(inc) {
    const items = inc && inc.entries.length ? this.items(inc) : [];
    const span = items.length >= 2 ? this.spanTimes(inc) : null;
    const min = span ? this.minutes(span.beginn, span.ende) : null;
    const verlauf = this.verlauf(items);
    const texts = verlauf.map(i => i.text);
    const acts = this.actions(texts);
    const problemAuto = (acts.length ? acts : this.defects(texts)).join(" und ");
    const problem = inc && typeof inc.problem === "string" ? inc.problem : problemAuto;   // von Hand korrigiert hat Vorrang
    const parts = [inc && inc.bereich, inc && inc.anlage && inc.anlage.code, problem].filter(Boolean);
    if (min !== null) parts.push("Ausfall: " + min + " min");
    const title = parts.join(" ");                                   // nur Leerzeichen, keine Striche
    const zeit = span ? "Störzeit: " + span.beginn + " - " + span.ende
               : items.length === 1 ? "Störzeit: ab " + items[0].time : "";
    const ihT = inc && inc.entries.length ? this.ihTime(inc) : "";
    const ih = ihT ? "IH vor Ort: " + ihT : "";
    return { items, verlauf, span, min, title, zeit, ih, head: [title, zeit, ih].filter(Boolean), problem, problemAuto };
  },
  /* Fortlaufender Störungsverlauf: „Problem gesucht, Schalter getauscht“ */
  paragraphLive(verlauf) { return verlauf.map(i => this.bare(i.text)).filter(Boolean).join(", "); },
  renderLive(inc, withTimes) {
    const L = this.live(inc);
    const body = withTimes ? L.verlauf.map(i => i.time + " – " + this.bare(i.text))
                           : [this.paragraphLive(L.verlauf)].filter(Boolean);
    return L.head.concat([""], body).join("\n");
  },
  subjectLive(inc) {
    const t = this.live(inc).title;
    return t || "Störungsbericht " + fmtDate(new Date(inc.createdAt), true);
  },
  /* Defektbeschreibung aus den Störungsschritten übernehmen (chronologisch, höchstens zwei verschiedene):
       „Schalter defekt festgestellt“ / „Der Schalter S3 ist defekt“ -> „Schalter defekt“ / „Schalter S3 defekt“
       „defekter Schalter“ -> „Schalter defekt“,  „Schalterdefekt“ -> „Schalter defekt“
       „Lampe kaputt“, „Netzteil ausgefallen“, „Taster funktioniert nicht“ werden wörtlich übernommen.
     Steht im Text kein Defekt, bleibt die Beschreibung leer – es wird nichts abgeleitet oder erfunden. */
  DEFECT_WORDS: "defekt|kaputt|ausgefallen|gebrochen|beschädigt|verschlissen|durchgebrannt|funktioniert nicht|reagiert nicht",
  defects(texts) {
    const N = "([A-ZÄÖÜ][a-zäöüß]+(?:[- ](?:[A-Z]{0,3}\\d+[A-Za-z]?))?)";
    const W = this.DEFECT_WORDS;
    const pats = [
      [new RegExp(N + "\\s+(?:ist\\s+|war\\s+|sind\\s+|waren\\s+)?(" + W + ")\\b"), m => m[1] + " " + m[2]],
      [new RegExp("\\b(?:[Dd]efekte[rns]?|[Kk]aputte[rns]?)\\s+" + N), m => m[1] + " defekt"],
      [/\b([A-ZÄÖÜ][a-zäöüß]{2,})defekt\b/, m => m[1] + " defekt"]
    ];
    const out = [];
    for (const t of texts) {
      let best = null;
      for (const [re, f] of pats) { const m = re.exec(t); if (m && (!best || m.index < best.i)) best = { i: m.index, v: f(m) }; }
      if (best && !out.some(x => x.toLowerCase() === best.v.toLowerCase())) out.push(best.v);
      if (out.length === 2) break;
    }
    return out;
  },
  /* Ältere Berichtsentwürfe (v4) erhalten die neue Überschrift, Berichtstexte bleiben */
  ensureHeading(inc) {
    const r = inc.report; if (!r || !r.items || r.heading || !inc.entries.length) return;
    r.heading = this.heading(inc); r.headingEdited = {};
  },

  build(inc) {
    const items = this.items(inc);
    const code = inc.anlage ? inc.anlage.code : "";
    return {
      version: 2,
      generatedAt: new Date().toISOString(),
      subject: this.subject(code, items.map(i => i.text)),
      view: "mit",
      heading: this.heading(inc),
      headingEdited: {},
      tab: "mit",
      items,
      editedAt: null,
      handedToMailAt: null
    };
  },

  /* Uhrzeiten aus den Einträgen in den Bericht übernehmen und neu ordnen, ohne Berichtstexte zu verlieren.
     Kopfzeiten werden nachgeführt, sofern sie nicht von Hand geändert wurden. */
  syncTimes(inc) {
    const r = inc.report; if (!r || !r.items || !inc.entries.length) return;
    const pos = new Map(inc.entries.map((e, n) => [e.id, n]));
    r.items.forEach(it => { const e = inc.entries.find(x => x.id === it.entryId); if (e) { it.time = e.time; it.timeSource = e.timeSource; } });
    r.items.sort((a, b) => (pos.has(a.entryId) ? pos.get(a.entryId) : 1e9) - (pos.has(b.entryId) ? pos.get(b.entryId) : 1e9));
    this.ensureHeading(inc);
    const h = this.spanTimes(inc), ed = r.headingEdited || {};
    ["beginn", "ende"].forEach(k => { if (!ed[k]) r.heading[k] = h[k]; });
  },

  /* Kopf (Bereich, Stichwort: Minuten, Störzeit) ist in beiden Ansichten identisch und behält seine Zeiten:
       MRA2
       Wackler und Ausfall: 120
       Störzeit 14:43 bis 15:02 = Ausfall 19 Minuten
       (Leerzeile)
     Mit Uhrzeiten: eine Zeile je Eintrag „14:43 – Text“. Ohne Uhrzeiten: fortlaufender Text in gleicher Reihenfolge. */
  headLines(report) {
    const h = report.heading, min = this.minutes(h.beginn, h.ende);
    const m = min === null ? "?" : String(min);
    return [h.bereich, (h.stichwort || "Störung") + ": " + m, "Störzeit " + (h.beginn || "?") + " bis " + (h.ende || "?") + " = Ausfall " + m + " Minuten"].filter(Boolean);
  },
  bare(t) { return String(t || "").trim().replace(/[\s.,;:!?]+$/, ""); },
  paragraph(report) {
    const parts = report.items.map(i => this.bare(i.text)).filter(Boolean);
    return parts.length ? parts.join(", ") + "." : "";
  },
  render(report, withTimes) {
    const body = withTimes ? report.items.filter(i => i.text.trim()).map(i => i.time + " – " + this.bare(i.text))
                           : [this.paragraph(report)];
    return this.headLines(report).concat([""], body).join("\n");
  },

  /* Wurden Details nach der Berichtserstellung ergänzt oder geändert? */
  outdated(inc) {
    const r = inc.report; if (!r || !r.items) return false;
    const ids = new Set(r.items.map(i => i.entryId));
    return inc.entries.length !== r.items.length || inc.entries.some(e => !ids.has(e.id) || (e.editedAt || e.createdAt) > r.generatedAt);
  }
};

/* ---------------- Anlagenkürzel ----------------
   Format: 3 Ziffern (vordere Nr.) + 3 Zeichen (Kürzel) + 3 Ziffern (hintere Nr.), z. B. 030RB_100.
   Gesprochene Begriffe werden über die Zuordnungstabelle aus den Einstellungen in Kürzel übersetzt.
   Bewusst einfach: Ist ein Begriff mehrdeutig oder als „bestätigen“ (?) markiert, entscheidet der Nutzer. */
const Anlagen = {
  FORMAT: /^\d{3}[A-Z0-9_]{3}\d{3}$/,
  LEGACY: /^[A-Z]{2}\d{2}$/,                        // bisherige Kurzform (z. B. SA11) bleibt gültig
  DEFAULTS: [
    { k: "RB_", terms: ["Roboter"] },
    { k: "GST", terms: ["Geostation", "Geo", "Station?"] }   // „?“ = Zuordnung jedes Mal bestätigen
  ],
  NUMWORDS: { null: 0, eins: 1, ein: 1, eine: 1, zwei: 2, drei: 3, vier: 4, fünf: 5, sechs: 6, sieben: 7, acht: 8, neun: 9, zehn: 10, elf: 11, zwölf: 12 },

  table() {
    const t = Store.data.settings.kuerzel;
    return Array.isArray(t) ? t : this.DEFAULTS;
  },
  isValid(code) { return this.FORMAT.test(code) || this.LEGACY.test(code); },
  pad3(n) { return String(n).padStart(3, "0"); },

  /* Bereits fertiges Kürzel? (getippt oder gesprochen als „030 RB 100“) */
  direct(text, tbl) {
    const s = String(text).toUpperCase().replace(/[\s.\-]/g, "");
    if (this.FORMAT.test(s)) return s;
    if (this.LEGACY.test(s)) return s;
    // gesprochen „030 RB 100“: Unterstrich wird nicht mitgesprochen -> bekanntes Kürzel suchen
    const m = /^(\d{1,3})\s*([A-Za-z0-9_]{2,3})\s*(\d{1,3})$/.exec(String(text).trim());
    if (m) {
      const mid = m[2].toUpperCase();
      const known = (tbl || this.table()).map(r => r.k).find(k => k === mid || k.replace(/_/g, "") === mid);
      if (known) return this.pad3(m[1]) + known + this.pad3(m[3]);
    }
    return null;
  },

  /* Gesprochene Bezeichnung -> Ergebnis
     { code, kuerzel, term, confirm, choices:[{k,term}], note, error } */
  resolve(text, tbl) {
    const T = tbl || this.table();
    const raw = String(text || "").trim();
    if (!raw) return { error: "Keine Bezeichnung erkannt." };
    const d = this.direct(raw, T);
    if (d) return { code: d, note: "Kürzel direkt übernommen" };

    // Begriffe suchen (längste zuerst, damit „Geostation“ vor „Station“ greift)
    const lower = raw.toLowerCase().replace(/-/g, " ");
    const entries = [];
    T.forEach(row => row.terms.forEach(t0 => {
      const confirm = /\?\s*$/.test(t0); const term = t0.replace(/\?\s*$/, "").trim();
      if (term) entries.push({ k: row.k, term, confirm });
    }));
    entries.sort((a, b) => b.term.length - a.term.length);
    // Begriff darf mit Leerzeichen zwischen den Buchstaben erkannt werden („Geo Station“ = „Geostation“)
    const escape = s => [...s.toLowerCase().replace(/\s+/g, "")].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("[\\s-]?");
    let hit = null;
    for (const e of entries) {
      const m = new RegExp("(?:^|[^a-zäöüß])(" + escape(e.term) + ")(?![a-zäöüß])", "i").exec(lower);
      if (m) { hit = { ...e, pos: m.index + m[0].length - m[1].length, len: m[1].length }; break; }
    }
    // Zahlen: bevorzugt hinter dem Begriff, sonst irgendwo im Text
    const nums = s => (s.match(/\b(\d{1,3})\b|\b(null|eins?|eine|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf)\b/gi) || [])
      .map(x => /^\d+$/.test(x) ? +x : this.NUMWORDS[x.toLowerCase()]);
    let n = hit && hit.pos >= 0 ? nums(lower.slice(hit.pos + hit.len)) : [];
    if (!n.length) n = nums(lower);
    const tooLong = /\d{4,}/.test(lower);

    if (!hit) {
      const legacy = Korrektur.parseKennung(raw);
      if (legacy) return { code: legacy, note: "bisherige Kurzform" };
      return { error: "Kein bekannter Anlagenbegriff gefunden. Kürzel in den Einstellungen ergänzen oder direkt eingeben, z. B. 030RB_100." };
    }
    if (tooLong) return { error: "Nummer mit mehr als drei Stellen erkannt – bitte korrigieren (vordere und hintere Nummer je höchstens drei Stellen)." };
    if (!n.length) return { error: "Für „" + hit.term + "“ fehlt die vordere Nummer, z. B. „" + hit.term + " 30“." };

    // Mehrdeutig: derselbe Begriff ist mehreren Kürzeln zugeordnet
    const same = entries.filter(e => e.term.toLowerCase() === hit.term.toLowerCase());
    const choices = [...new Set(same.map(e => e.k))];
    const front = this.pad3(n[0]), back = n.length > 1 ? this.pad3(n[1]) : "001";
    const build = k => front + k + back;
    const res = { code: build(hit.k), kuerzel: hit.k, term: hit.term, front, back, backDefault: n.length < 2,
                  confirm: hit.confirm || choices.length > 1 };
    if (choices.length > 1) res.choices = choices.map(k => ({ k, code: build(k) }));
    return res;
  },

  /* Anlage aus einem Störungsschritt erkennen – nur wenn eindeutig (keine Vermutungen) */
  detect(text) {
    const t = String(text || "");
    const full = /(?:^|[^0-9A-Za-z])(\d{3}[A-Z0-9_]{3}\d{3})(?![0-9A-Za-z])/.exec(t);
    if (full) return full[1];
    const legacy = /(?:^|[^A-Za-zÄÖÜäöüß])([A-Z])[.\s-]?([A-Z])\s?(\d)(\d)(?!\d)/.exec(t);
    if (legacy) return legacy[1] + legacy[2] + legacy[3] + legacy[4];
    const r = this.resolve(t);
    if (!r.error && r.term && !r.confirm && !r.choices) return r.code;
    return null;
  },
  /* Text für die Rückmeldung im Diktierfenster */
  explain(r) {
    if (r.error) return r.error;
    if (!r.term) return "Erkannt: <b>" + esc(r.code) + "</b> (" + esc(r.note || "") + ")";
    return "Erkannt: <b>" + esc(r.code) + "</b> – „" + esc(r.term) + "“ → " + esc(r.kuerzel) + ", vordere Nr. " + r.front +
           ", hintere Nr. " + r.back + (r.backDefault ? " (Standard, keine genannt)" : "");
  }
};

/* ---------------- 3. Speech ----------------
   Diktierphase ("Session") vs. Erkennungsdurchlauf ("Run"):
   - Eine Session beginnt mit „Diktieren“ und endet NUR durch „Aufnahme erledigt“
     (oder einen echten Fehler / App geht in den Hintergrund).
   - Android beendet einen Erkennungsdurchlauf nach kurzen Pausen selbst. Dann wird
     der Text des Durchlaufs genau einmal übernommen und automatisch ein neuer
     Durchlauf gestartet. So gehen Pausen und Nachdenken nicht verloren.
   - Der gesammelte Text steht laufend im Eingabefeld und wird als Entwurf gesichert. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isAndroid = /Android/i.test(navigator.userAgent);
const DIAG_KEY = "stoerungslogger.diag";
const DRAFT_KEY = "stoerungslogger.draft";
const START_TIMEOUT_MS = 8000;
const MAX_QUICK_FAILS = 5;            // so oft hintereinander sofortiges Ende ohne Text -> Fehler
const ENV_MSG = {
  unsupported: "Dieser Browser hat keine Spracherkennung. Bitte die Seite in Google Chrome öffnen.",
  insecure: "Spracherkennung braucht eine sichere Verbindung (https://). Diese Seite ist nicht sicher geladen.",
  policy: "In dieser eingebetteten Ansicht (z. B. claude.ai-Vorschau) ist das Mikrofon technisch gesperrt. Direktes Diktieren geht nur, wenn die App als eigene Seite in Chrome geöffnet wird."
};
const ERR_MSG = {
  "not-allowed": "Kein Zugriff auf das Mikrofon. In Chrome: Schloss-Symbol links neben der Adresse → Berechtigungen → Mikrofon → Zulassen. Danach Seite neu laden.",
  "service-not-allowed": "Chrome lässt die Spracherkennung nicht zu. Prüfen: Ist die App „Google“ installiert und aktiviert? Android-Einstellungen → Apps → Google → aktiviert, Berechtigung Mikrofon erlaubt.",
  "audio-capture": "Kein Mikrofon verfügbar oder es wird gerade von einer anderen App benutzt (z. B. Telefonat, Sprachmemo).",
  "network": "Die Spracherkennung von Chrome braucht eine Internetverbindung.",
  "no-speech": "Es wurde keine Sprache erkannt. Bitte direkt nach dem Antippen sprechen.",
  "aborted": "Aufnahme abgebrochen – kein Text übernommen.",
  "language-not-supported": "Deutsch wird von der Spracherkennung auf diesem Gerät nicht unterstützt.",
  "start-failed": "Die Spracherkennung konnte nicht gestartet werden.",
  "start-timeout": "Die Spracherkennung hat innerhalb von 8 Sekunden nicht gestartet.",
  "restart-loop": "Die Spracherkennung beendet sich ständig sofort wieder.",
  "no-result": "Aufnahme beendet, aber kein Text erkannt."
};
/* Echte Fehler: Diktierphase beenden (bisheriger Text bleibt erhalten). Alles andere -> automatisch weiter. */
const FATAL_ERRORS = ["not-allowed", "service-not-allowed", "audio-capture", "network", "language-not-supported", "start-failed", "start-timeout"];
/* Fehler vor Beginn der Diktierphase -> Tastatur-Eingabe anbieten */
const FALLBACK_ERRORS = FATAL_ERRORS;

const Speech = {
  supported: !!SR,
  session: null, run: null, rec: null, preparing: false,
  startTimer: null, stopTimer: null, restartTimer: null,
  t0: 0, log: [], lastError: null, lastSuccess: null, errorDetail: "",

  /* ---- Diagnose ---- */
  loadDiag() { try { const d = JSON.parse(localStorage.getItem(DIAG_KEY) || "{}"); this.lastError = d.lastError || null; this.lastSuccess = d.lastSuccess || null; this.log = d.log || []; } catch (e) {} },
  saveDiag() { try { localStorage.setItem(DIAG_KEY, JSON.stringify({ lastError: this.lastError, lastSuccess: this.lastSuccess, log: this.log })); } catch (e) {} },
  note(ev) { this.log.push(((performance.now() - this.t0) / 1000).toFixed(1) + " s " + ev); if (this.log.length > 40) this.log.shift(); },
  recordError(code, detail) { this.lastError = { code, detail: detail || "", at: new Date().toISOString() }; this.saveDiag(); },
  errMsg(code) { return (ERR_MSG[code] || "Spracherkennung meldet einen Fehler.") + " (Code: " + code + ")"; },

  /* ---- Entwurf (übersteht versehentliches Schließen/Neuladen) ---- */
  saveDraft() {
    const s = this.session; if (!s) return;
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ startedAt: s.startedAt.toISOString(), text: this.fullText(), incidentId: Store.data.currentId, purpose: this.purpose })); } catch (e) {}
  },
  loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { return null; } },
  clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} },

  /* ---- Voraussetzungen ---- */
  envProblem() {
    if (!SR) return "unsupported";
    if (!window.isSecureContext) return "insecure";
    try {
      const fp = document.permissionsPolicy || document.featurePolicy;
      if (fp && fp.allowsFeature && !fp.allowsFeature("microphone")) return "policy";
    } catch (e) {}
    return null;
  },
  async micPermissionState() {
    try { return (await navigator.permissions.query({ name: "microphone" })).state; } catch (e) { return "unbekannt"; }
  },
  /* Klärt die Mikrofonberechtigung, bevor die Erkennung startet. Liefert "ok" oder einen Fehlercode. */
  async ensureMic() {
    const state = await this.micPermissionState();
    this.note("Berechtigung: " + state);
    if (state === "granted") return "ok";
    if (state === "denied") return "not-allowed";
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return "ok";
    UI.status("Bitte den Mikrofonzugriff im Chrome-Dialog <b>erlauben</b> …", "info", true);
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach(t => t.stop());       // sofort freigeben – keine Audioaufnahme
      this.note("Mikrofon freigegeben");
      return "ok";
    } catch (e) {
      this.note("getUserMedia-Fehler: " + e.name);
      this.errorDetail = e.name;
      if (e.name === "NotFoundError" || e.name === "NotReadableError" || e.name === "AbortError") return "audio-capture";
      return "not-allowed";
    }
  },

  /* ---- Start durch „Diktieren“ ---- */
  purpose: null,                                // "anlage" oder "detail"
  async start(purpose) {
    if (this.preparing || (this.session && !this.session.ended)) return;
    this.purpose = purpose || "detail";
    const problem = this.envProblem();
    if (problem) { UI.status(ENV_MSG[problem], "err", true); UI.openManualEntry(ENV_MSG[problem]); return; }
    this.t0 = performance.now(); this.log = []; this.errorDetail = "";
    const startedAt = new Date();                // Erfassungszeitpunkt = Antippen
    this.note("Diktieren angetippt (" + (isAndroid ? "Android" : "kein Android") + ")");
    this.preparing = true;
    const perm = await this.ensureMic();
    this.preparing = false;
    if (perm !== "ok") {
      this.recordError(perm, this.errorDetail);
      const msg = this.errMsg(perm);
      UI.status(msg, "err", true); UI.openManualEntry(msg, startedAt);
      return;
    }
    UI.status("", "hidden");
    this.beginSession(startedAt, "");
  },

  beginSession(startedAt, base) {
    this.session = { startedAt, base, segments: [], ended: false, userStop: false, quickFails: 0, restarts: 0 };
    UI.openDictation(startedAt, false, this.purpose);
    UI.recording(true);
    this.startRun();
  },

  /* „Weiter diktieren“ nach dem Beenden: Text im Feld bleibt Grundlage, Zeitstempel bleibt. */
  resume(startedAt, base) {
    if (this.preparing || (this.session && !this.session.ended)) return;
    this.note("Weiter diktieren");
    this.session = { startedAt, base, segments: [], ended: false, userStop: false, quickFails: 0, restarts: 0 };
    UI.dictMode("rec");
    UI.recording(true);
    this.startRun();
  },

  /* ---- Ein Erkennungsdurchlauf ---- */
  startRun() {
    const s = this.session; if (!s || s.ended) return;
    let r;
    try { r = new SR(); } catch (e) { this.endSession("start-failed", e.name || String(e)); return; }
    r.lang = "de-DE";
    r.continuous = !isAndroid;                  // Android: Einzeläußerung pro Durchlauf, Neustart übernimmt die App
    r.interimResults = true; r.maxAlternatives = 1;
    const run = { finals: [], interim: "", started: false, done: false, error: null, errorDetail: "", t: performance.now() };
    this.run = run; this.rec = r;
    const started = (ev) => {
      this.note(ev);
      if (this.rec !== r || run.started) return;
      run.started = true; clearTimeout(this.startTimer);
      UI.dictState("listening");
    };
    r.onstart = () => started("start");
    r.onaudiostart = () => started("audiostart");
    r.onsoundstart = () => this.note("soundstart");
    r.onspeechstart = () => this.note("speechstart");
    r.onspeechend = () => this.note("speechend");
    r.onnomatch = () => this.note("nomatch");
    r.onresult = (ev) => {
      if (this.rec !== r) return;
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript.trim();
        if (!t) continue;
        if (ev.results[i].isFinal) this.addFinal(run, t, i); else interim = t;
      }
      run.interim = interim;
      this.note("result" + (interim ? " (vorläufig)" : " (fertig)"));
      UI.dictText(this.fullText());
      this.saveDraft();
    };
    r.onerror = (ev) => {
      this.note("error: " + ev.error + (ev.message ? " – " + ev.message : ""));
      if (this.rec !== r) return;
      if (!run.error) { run.error = ev.error; run.errorDetail = ev.message || ""; }
    };
    r.onend = () => { this.note("end"); if (this.rec === r) this.runEnded(run); };
    this.startTimer = setTimeout(() => {
      if (run.started || this.rec !== r) return;
      this.note("Watchdog: kein Start nach " + START_TIMEOUT_MS / 1000 + " s");
      run.error = "start-timeout"; try { r.abort(); } catch (e) {}
      this.runEnded(run);
    }, START_TIMEOUT_MS);
    try { r.start(); this.note("start() aufgerufen" + (s.restarts ? " (Neustart " + s.restarts + ")" : "")); UI.dictState(s.restarts ? "restarting" : "starting"); }
    catch (e) { this.note("start() Ausnahme: " + (e.name || e)); run.error = "start-failed"; run.errorDetail = e.name || String(e); this.runEnded(run); }
  },

  /* Android liefert teils kumulierte Ergebnisse: gleicher Index wird ersetzt, Wiederholung nicht doppelt übernommen. */
  addFinal(run, t, idx) {
    const prev = run.finals[run.finals.length - 1];
    if (prev && (prev.idx === idx || (isAndroid && t.toLowerCase().startsWith(prev.t.toLowerCase())))) { prev.t = t; prev.idx = idx; }
    else if (!prev || prev.t.toLowerCase() !== t.toLowerCase()) run.finals.push({ t, idx });
  },
  runText(run, withInterim) {
    const f = run.finals.map(x => x.t).join(" ").trim();
    if (withInterim) return (f + " " + (run.interim || "")).trim();
    return f || (run.interim || "").trim();      // ohne endgültiges Ergebnis: letzte Zwischenerkennung retten
  },
  fullText() {
    const s = this.session; if (!s) return "";
    const live = this.run && !this.run.done ? this.runText(this.run, true) : "";
    return [s.base, ...s.segments, live].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
  },

  /* Ende eines Durchlaufs: Text genau einmal übernehmen, dann neu starten oder Session beenden. */
  runEnded(run) {
    if (run.done) return;
    run.done = true;
    clearTimeout(this.startTimer); clearTimeout(this.stopTimer);
    this.rec = null;
    const s = this.session;
    const seg = this.runText(run, false);
    if (seg) {
      const last = s.segments[s.segments.length - 1];
      if (!last || last.toLowerCase() !== seg.toLowerCase()) s.segments.push(seg);
      s.quickFails = 0;
    }
    this.run = null;
    UI.dictText(this.fullText());
    this.saveDraft();
    if (s.ended) return;
    if (s.userStop) { this.endSession(null); return; }
    if (run.error && FATAL_ERRORS.includes(run.error)) { this.endSession(run.error, run.errorDetail); return; }
    // Normales Ende nach Pause, "no-speech", "aborted", "nomatch": weiter aufnehmen
    // Stille ("no-speech") ist normal und zählt nie als Fehlschlag; nur sofortiges Ende ohne Text
    if (!seg && run.error !== "no-speech" && performance.now() - run.t < 1500) s.quickFails++;
    if (s.quickFails >= MAX_QUICK_FAILS) { this.endSession("restart-loop"); return; }
    s.restarts++;
    UI.dictState("restarting");
    this.restartTimer = setTimeout(() => this.startRun(), seg ? 80 : 250);
  },

  /* „Aufnahme erledigt“ – einzige normale Art, die Diktierphase zu beenden. */
  finishByUser() {
    const s = this.session; if (!s || s.ended || s.userStop) return;
    s.userStop = true;
    this.note("Aufnahme erledigt angetippt");
    clearTimeout(this.restartTimer);
    UI.dictState("finishing");
    if (this.rec && this.run) {
      const run = this.run;
      try { this.rec.stop(); } catch (e) {}      // letzter Text des Durchlaufs kommt noch an
      this.stopTimer = setTimeout(() => { this.note("kein end-Ereignis nach Stopp"); try { this.rec && this.rec.abort(); } catch (e) {} this.runEnded(run); }, 3000);
    } else this.endSession(null);
  },

  /* Verwerfen während der Aufnahme */
  cancel() {
    const s = this.session; if (!s || s.ended) return;
    s.userStop = true; s.ended = true;
    this.note("Diktat verworfen");
    clearTimeout(this.restartTimer); clearTimeout(this.startTimer); clearTimeout(this.stopTimer);
    if (this.rec) { const r = this.rec; this.rec = null; try { r.abort(); } catch (e) {} }
    this.run = null;
    UI.recording(false);
    this.saveDiag();
  },

  /* App geht in den Hintergrund (Bildschirm aus, App-Wechsel): sauber beenden, Text bleibt im Feld. */
  pauseForBackground() {
    const s = this.session; if (!s || s.ended || s.userStop) return;
    this.note("App im Hintergrund – Aufnahme beendet");
    s.background = true;
    this.finishByUser();
  },

  endSession(err, detail) {
    const s = this.session; if (!s || s.ended) return;
    s.ended = true;
    clearTimeout(this.restartTimer); clearTimeout(this.startTimer); clearTimeout(this.stopTimer);
    if (this.rec) { const r = this.rec; this.rec = null; try { r.abort(); } catch (e) {} }
    if (this.run) { const run = this.run; run.done = true; const seg = this.runText(run, false); if (seg) s.segments.push(seg); this.run = null; }
    UI.recording(false);
    const text = this.fullText();
    let msg = null, kind = null;
    if (err) { this.recordError(err, detail); msg = this.errMsg(err) + (text ? " Der bisher erkannte Text ist erhalten." : "") + " Du kannst den Text unten auch per Tastatur-Mikrofon ergänzen."; kind = "err"; }
    else if (!text) { this.recordError("no-result", ""); msg = this.errMsg("no-result") + " Du kannst „Weiter diktieren“ oder das Tastatur-Mikrofon nutzen."; kind = "info"; }
    else { this.lastSuccess = new Date().toISOString(); this.saveDiag(); if (s.background) { msg = "Aufnahme beendet, weil die App in den Hintergrund ging. Der Text ist erhalten."; kind = "info"; } }
    this.saveDraft();
    UI.dictReview(text, msg, kind);
  },

  diagnose() {
    const yes = b => b ? "ja ✓" : "NEIN ✗";
    let embedded = false; try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
    const p = this.envProblem();
    const when = iso => iso ? fmtDate(new Date(iso), true) + " " + fmtTime(new Date(iso)) : "";
    return "Spracherkennung im Browser: " + yes(!!SR) + (SR ? (window.SpeechRecognition ? " (SpeechRecognition)" : " (webkitSpeechRecognition)") : "") +
      "\nSichere Verbindung (https): " + yes(window.isSecureContext) +
      "\nEingebettete Ansicht: " + (embedded ? "ja (Mikrofon meist gesperrt)" : "nein ✓") +
      "\nMikrofon für diese Seite gesperrt: " + (p === "policy" ? "JA ✗" : "nein ✓") +
      '\nMikrofon-Berechtigung: <span id="permState">wird geprüft …</span>' +
      "\nModus: " + (isAndroid ? "Android – Einzeläußerungen mit automatischem Neustart" : "Dauererkennung mit automatischem Neustart") +
      "\nLetzter Erfolg: " + (this.lastSuccess ? when(this.lastSuccess) : "–") +
      "\nLetzter Fehler: " + (this.lastError ? esc(this.lastError.code + (this.lastError.detail ? " (" + this.lastError.detail + ")" : "")) + ", " + when(this.lastError.at) : "–") +
      (this.log.length ? "\n\nAblauf letzter Versuch:\n" + esc(this.log.join("\n")) : "");
  }
};
Speech.loadDiag();

/* ---------------- Hilfsfunktionen ---------------- */
const pad = n => String(n).padStart(2, "0");
function fmtTime(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fmtDate(d, year) { return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + (year ? d.getFullYear() : ""); }
function fmtDuration(m) { return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + pad(m % 60) + " min"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const $ = id => document.getElementById(id);
const TIMEATTR = 'type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off"';
const HEADICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 13c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm6.08-7.95c.84 1.18.84 2.71 0 3.89l1.68 1.69c2.02-2.02 2.02-5.07 0-7.27l-1.68 1.69zM20.07 2l-1.63 1.63c2.77 3.02 2.77 7.56 0 10.74L20.07 16c3.9-3.89 3.91-9.95 0-14z"/></svg>';
/* "1443" / "14.43" / "9:5" / "9" -> "14:43" / "09:05" / "09:00"; ungültig -> "" */
function normTime(v) {
  const t = String(v || "").trim().replace(/\s*uhr$/i, "");
  let m = /^(\d{1,2})[:.,](\d{1,2})$/.exec(t) || /^(\d{1,2})(\d{2})$/.exec(t) || /^(\d{1,2})$/.exec(t);
  if (!m) return "";
  const h = +m[1], mi = +(m[2] || 0);
  return h < 24 && mi < 60 ? pad(h) + ":" + pad(mi) : "";
}

/* ---------------- 4. UI ---------------- */
const PURPOSE = {
  anlage: { title: "Anlage nennen", review: "Anlage prüfen", save: "Anlage übernehmen",
            hint: "Bezeichnung sprechen, z. B. „Roboter 30 100“ oder „Geostation 30“. Danach auf „Aufnahme erledigt“ tippen." },
  detail: { title: "Störungsdetail", review: "Detail prüfen", save: "Detail speichern",
            hint: "Sprechpausen sind kein Problem – die Aufnahme läuft weiter, bis du auf „Aufnahme erledigt“ tippst." }
};
const UI = {
  statusTimer: null,
  register: "roh",

  /* ---- Hauptansicht: Register Rohdaten | Mit Uhrzeiten | Ohne Uhrzeiten ---- */
  render() {
    const inc = Store.current();
    const reg = inc ? (inc.register || "roh") : this.register;
    $("incTitle").textContent = inc ? this.incLabel(inc) : "Noch kein Vorgang";
    const head = $("anlageHead");
    if (inc && inc.anlage) { head.innerHTML = '<span id="anlageCode">' + esc(inc.anlage.code) + '</span><span class="edit" aria-hidden="true">✎</span>'; head.classList.remove("empty-head"); }
    else { head.textContent = "Anlage noch nicht genannt"; head.classList.add("empty-head"); }
    const bb = $("bereichBtn");
    bb.hidden = !inc;
    if (inc) bb.innerHTML = inc.bereich ? 'Bereich <b id="bereichCode">' + esc(inc.bereich) + '</b> ✎' : "＋ Bereich ergänzen (optional)";
    ["roh", "mit", "ohne"].forEach(r => $("reg" + r.charAt(0).toUpperCase() + r.slice(1)).classList.toggle("on", reg === r));
    if (reg === "roh") this.renderEntries(inc); else this.renderLive(inc, reg === "mit");
    this.renderBottom(inc, reg);
  },
  incLabel(inc) {
    const d = new Date(inc.createdAt);
    return (inc.anlage ? inc.anlage.code : "Neuer Vorgang") + " · " + fmtDate(d) + " " + fmtTime(d) + " · " + inc.entries.length + (inc.entries.length === 1 ? " Eintrag" : " Einträge");
  },
  recentCodes() {
    const seen = [];
    Store.data.incidents.forEach(i => { if (i.anlage && !seen.includes(i.anlage.code)) seen.push(i.anlage.code); });
    return seen.slice(0, 6);
  },

    let html = '<div class="titlecard"><div class="tlabel">Titel</div>' +

        recent.map(c => '<button class="chip" data-code="' + esc(c) + '">' + esc(c) + '</button>').join("") + '</div>';
    }
    html += '<div class="steplbl">Störungsschritte</div>';
    if (inc && inc.entries.length) {
      html += inc.entries.map(e => {
        const meta = [e.source === "manuell" ? "geschrieben" : "gesprochen",
                      e.editedAt ? "Text bearbeitet " + fmtTime(new Date(e.editedAt)) + " Uhr" : ""]
                     .filter(Boolean).join(" · ");
        return '<div class="entry"><div class="etimebox"><input ' + TIMEATTR + ' class="etime" data-id="' + e.id + '" value="' + esc(e.time) + '" aria-label="Uhrzeit des Ereignisses">' +
               '<small>' + esc(e.timeSource || "erfasst") + '</small></div><div class="body">' + esc(e.text) +
               (meta ? '<div class="meta">' + meta + '</div>' : "") +
               '</div><button class="more" data-id="' + e.id + '" aria-label="Eintrag bearbeiten">⋯</button></div>';
      }).join("");
    } else {
      html += '<div class="empty">Noch keine Schritte erfasst.<br>Unten <b>Sprechen</b> oder <b>Schreiben</b> – der Bericht entsteht automatisch.</div>';
    }

  /* Titelzeile: Bereich, Anlage und Problem direkt bearbeiten; Berichte folgen automatisch */
  wireTitle() {
    const refresh = () => {
      const inc = Store.current(), L = ReportRules.live(inc);
      $("tTitle").textContent = L.title || "–";
      $("incTitle").textContent = inc ? this.incLabel(inc) : "Noch kein Vorgang";
    };
    const need = () => Store.current() || Store.newIncident();
    $("tBereich").oninput = () => {
      const v = ReportRules.normBereich($("tBereich").value);
      if (v !== $("tBereich").value) $("tBereich").value = v;
      need().bereich = v; Store.save(); refresh();
    };
    $("tProblem").oninput = () => { need().problem = $("tProblem").value.replace(/\s*-\s*/g, " ").replace(/\s{2,}/g, " "); Store.save(); refresh(); };
    if ($("tProblemAuto")) $("tProblemAuto").onclick = () => { const inc = need(); delete inc.problem; Store.save(); this.render(); };
    $("tAnlage").onchange = () => {
      const raw = $("tAnlage").value.trim(), inc = need();
      if (!raw) { inc.anlage = null; Store.save(); this.render(); return; }
      const r = Anlagen.resolve(raw);
      if (r.error) { this.status(esc(r.error), "err", true); return; }
      if (r.choices && !Anlagen.direct(raw)) { this.status("Mehrdeutig – bitte das Kürzel direkt eintragen: " + r.choices.map(c => esc(c.code)).join(" oder "), "err", true); return; }
      inc.anlage = { code: r.code, raw, at: new Date().toISOString() }; Store.save(); this.render();
      this.status("✓ Anlage " + esc(r.code) + " übernommen.", "ok");
    };
    $("tAnlageMic").onclick = () => Speech.start("anlage");
  },

  liveText() {},

  ask(msg, yesLabel, onYes) {
    this.openSheet('<h2>Bitte bestätigen</h2><p>' + esc(msg) + '</p><div class="row"><button class="btn" data-act="close">Abbrechen</button>' +
      '<button class="btn primary" id="askYes">' + esc(yesLabel) + '</button></div>');
